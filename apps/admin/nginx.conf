server {
  listen       ${PORT};
  server_name  _;

  root   /usr/share/nginx/html;
  index  index.html;

  auth_basic "Anstoss Admin";
  auth_basic_user_file /etc/nginx/admin.htpasswd;
  proxy_ssl_server_name on;
  proxy_ssl_name $proxy_host;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://anstoss-api-production.up.railway.app https://api.anstoss.io" always;
  add_header Cache-Control "no-store" always;

  location = /admin {
    proxy_pass ${API_UPSTREAM}/admin;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_x_anstoss_session;
    proxy_set_header X-Admin-Key $http_x_admin_key;
    proxy_redirect off;
  }

  location ^~ /admin/ {
    proxy_pass ${API_UPSTREAM}/admin/;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_x_anstoss_session;
    proxy_set_header X-Admin-Key $http_x_admin_key;
    proxy_redirect off;
  }

  location = /auth {
    proxy_pass ${API_UPSTREAM}/auth;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_redirect off;
  }

  location ^~ /auth/ {
    proxy_pass ${API_UPSTREAM}/auth/;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_redirect off;
  }

  location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|woff2?)$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    auth_basic off;
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  server_tokens off;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
