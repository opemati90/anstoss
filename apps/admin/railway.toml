# Railway service config for the internal Anstoss admin console.
# Required env vars: ADMIN_BASIC_AUTH_USERNAME and ADMIN_BASIC_AUTH_PASSWORD.
# Leave the in-browser API base blank in production so /admin/* and /auth/*
# use the same-origin nginx proxy to API_UPSTREAM.

[build]
dockerfilePath = "apps/admin/Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
