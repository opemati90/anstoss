# Railway service config for the internal Anstoss admin console.
# Admin console username/password auth is enforced by the API service.
# Leave the in-browser API base blank in production so /admin/* and /auth/*
# use the same-origin nginx proxy to API_UPSTREAM.

[build]
# Railway builds this isolated service with /apps/admin as its source root.
# Keep the Dockerfile path relative to that root so both Git deploys and
# `railway up apps/admin --path-as-root` select the nginx image.
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
