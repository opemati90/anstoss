appId: com.renuirug.anstoss
---
- runFlow: subflows/launch.yaml
# Welcome → "No club yet? Get found as a player" (free-agent path, 4 screens).
- tapOn:
    id: "welcome-email"
- inputText: "qa-fa-audit+clerk_test@example.com"
- tapOn:
    id: "welcome-free-agent"
- extendedWaitUntil:
    visible: ".*Enter the code.*"
    timeout: 25000
- tapOn:
    point: "50%,42%"
- inputText: "424242"
- extendedWaitUntil:
    visible: ".*What’s your name.*"
    timeout: 25000
- tapOn:
    id: "name-input"
- inputText: "Yemi Ajimati"
# Onboarding review fix (B1/B3): the date of birth sits on the name screen.
- tapOn:
    id: "dob-day"
- inputText: "04"
- tapOn:
    id: "dob-month"
- inputText: "03"
- tapOn:
    id: "dob-year"
- inputText: "1996"
- tapOn:
    id: "name-continue"
# Name + DOB → straight to the free-agent profile (no role screen, no Verein finden).
- extendedWaitUntil:
    visible: ".*(Position|player profile|Postleitzahl|postcode|Save).*"
    timeout: 25000
- takeScreenshot: "/tmp/audit-fa-landing"
