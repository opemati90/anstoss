appId: com.renuirug.anstoss
---
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=parent"
# Scenario data loads async; wait for the home to finish rendering on slower
# (iOS) devices before asserting.
# iOS flattens the Pressable card into one accessibility element with
# concatenated text, so match the substring rather than the exact node.
- extendedWaitUntil:
    visible: ".*Saturday away match.*"
    timeout: 15000
- assertVisible: "ANNOUNCEMENTS"
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://events"
- assertVisible: "Children's schedule"
- assertVisible: "Next event"
