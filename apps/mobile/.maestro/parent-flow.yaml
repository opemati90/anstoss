appId: com.renuirug.anstoss
---
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=parent"
# Scenario data loads async; wait for the home to finish rendering on slower
# (iOS) devices before asserting.
# Home shows one card per child ("Leo · U15", "Mia · U11") with the next
# event and the reply pills inline; the rest of the schedule lives on the
# Schedule tab. The parent's own jobs (Kuchen-Dienst) sit below the cards.
- extendedWaitUntil:
    visible: "Leo · U15"
    timeout: 15000
- assertVisible: "Mia · U11"
- assertVisible: "Reply for Leo"
- tapOn:
    id: "parent-rsvp-child-1-YES"
- scrollUntilVisible:
    element: "My jobs"
    direction: DOWN
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://events"
- assertVisible: "Children's schedule"
- assertVisible: "Next event"
