appId: com.renuirug.anstoss
---
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: club-header-identity
    timeout: 60000
- openLink: 'anstoss://chat/${QA_SHORT_DM_ID}?kind=dm'
- extendedWaitUntil:
    visible: '.*Short conversation keyboard check.*'
    timeout: 20000
- takeScreenshot: /private/tmp/anstoss-chat-before-keyboard
- tapOn:
    id: chat-message-input
- extendedWaitUntil:
    visible:
      id: space
    timeout: 10000
- takeScreenshot: /private/tmp/anstoss-chat-keyboard-open
- assertVisible: '.*Short conversation keyboard check.*'
- inputText: Keyboard visibility regression
- takeScreenshot: /private/tmp/anstoss-chat-keyboard-draft
- assertVisible: '.*Short conversation keyboard check.*'
- assertVisible: 'Keyboard visibility regression'
- assertVisible:
    id: chat-send-message
- eraseText
- swipe:
    start: '50%,38%'
    end: '50%,65%'
    duration: 500
- assertVisible: '.*Short conversation keyboard check.*'
