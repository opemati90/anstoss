appId: com.renuirug.anstoss
---
# Kader revamp: the Team tab is the squad. A coach sees one squad number,
# the availability summary, the open-requests banner, players grouped by
# line with their status, and exactly three team tools. A player sees their
# own row pinned on top with "Change status".
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=coach"
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://squad"
- extendedWaitUntil:
    visible: "Squad"
    timeout: 15000
- assertVisible: ".*· 18 players"
- assertVisible: "15 fit"
- assertVisible: "1 suspended"
- assertVisible: "2 away"
- assertVisible:
    id: "kader-requests-banner"
- assertVisible: "Defence"
- takeScreenshot: /tmp/claude-501/-Users-yemi/20fbad7e-c058-4f1c-9bff-49c32cad7bb0/scratchpad/kader-coach
# Filter to the suspended player and back.
- tapOn:
    id: "kader-summary-SUSPENDED"
- assertVisible: "Niklas Wagner"
- assertNotVisible: "Tim Weber"
- tapOn:
    id: "kader-summary-SUSPENDED"
# Coach taps a player: the edit sheet, not a DM.
- tapOn:
    id: "kader-row-user-player-2"
- extendedWaitUntil:
    visible: "Edit player"
    timeout: 10000
- takeScreenshot: /tmp/claude-501/-Users-yemi/20fbad7e-c058-4f1c-9bff-49c32cad7bb0/scratchpad/kader-edit
- tapOn: "Cancel"
# Team tools.
- scrollUntilVisible:
    element:
      id: "kader-tool-duties"
    direction: DOWN
- assertVisible:
    id: "kader-tool-matches"
- assertVisible:
    id: "kader-tool-stats"
- tapOn:
    id: "kader-tool-duties"
- extendedWaitUntil:
    visible: "Assign the next round"
    timeout: 10000
- takeScreenshot: /tmp/claude-501/-Users-yemi/20fbad7e-c058-4f1c-9bff-49c32cad7bb0/scratchpad/kader-duties
# Player view
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=player"
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://squad"
- extendedWaitUntil:
    visible:
      id: "kader-self-status"
    timeout: 15000
- assertNotVisible:
    id: "kader-requests-banner"
- takeScreenshot: /tmp/claude-501/-Users-yemi/20fbad7e-c058-4f1c-9bff-49c32cad7bb0/scratchpad/kader-player
