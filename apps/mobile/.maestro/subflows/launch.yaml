# Cold-launch the dev client and load the JS bundle from Metro (port 8123).
#
# The path differs per platform:
#   - iOS: the openLink loads the bundle directly, but pops a native
#     "Open in Anstoss?" confirmation that must be tapped.
#   - Android: after clearState the first openLink can initialise the dev client
#     and land on an empty server list before discovery finishes. Re-sending the
#     same explicit URL is deterministic and does not depend on mDNS discovery.
#     Once loaded, Android auto-shows the dev-client menu sheet, dismissed via
#     its "Continue" button.
#
# Maestro matches the FULL element text as a regex, so substrings are wrapped
# in .* and every branch is conditional so it is a no-op on the other platform.
appId: com.renuirug.anstoss
---
- launchApp:
    clearState: true
- openLink: 'exp+anstoss://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8123'
- runFlow:
    when:
      visible: 'Open'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible: '.*(DEVELOPMENT SERVERS|Development servers|developer menu|Send code).*'
    timeout: 180000
- runFlow:
    when:
      visible: '.*(DEVELOPMENT SERVERS|Development servers).*'
    commands:
      - openLink: 'exp+anstoss://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8123'
      - extendedWaitUntil:
          visible: '.*(developer menu|Send code).*'
          timeout: 180000
- runFlow:
    when:
      visible: '.*developer menu.*'
    commands:
      - tapOn: 'Continue'
# Dismissing the onboarding leaves the main dev-menu sheet (Reload / Go home)
# open over the app. Tap the dimmed scrim above the sheet to close it.
- runFlow:
    when:
      visible: 'Go home'
    commands:
      - tapOn:
          point: '50%,10%'
# The bundle is now loaded. Do NOT assert a specific landing screen here — the
# app may resume a persisted Clerk session (account-next-step / tabs) instead of
# the signed-out sign-in screen. Each flow deeplinks its own scenario next; this
# only confirms the app rendered SOMETHING and lets animations settle.
- extendedWaitUntil:
    visible: '.*(Send code|Get started|Log in|Next step|Find your club|coach invite|Set up your child|Your request is with the club|Awaiting approval|Home|Events|Squad|Today|Welcome).*'
    timeout: 180000
- waitForAnimationToEnd:
    timeout: 4000
