appId: com.renuirug.anstoss
---
# MVP FLOW A1: New club admin creates a club/team and can open club-scoped admin tools.
# This assumes the dev client bundle is already loaded by the surrounding smoke suite.
# The cold-launch path is covered by the player flows; starting hot avoids an iOS
# dev-launcher stall seen when the app resumes from the welcome hero.
- launchApp:
    clearState: false
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: 'anstoss://e2e?scenario=signup-club-admin'
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      notVisible: 'Finish setting up your club'
    commands:
      - runFlow:
          file: subflows/deeplink.yaml
          env:
            URL: 'anstoss://e2e?scenario=signup-club-admin'
- extendedWaitUntil:
    visible: 'Finish setting up your club'
    timeout: 15000
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: 'anstoss://club-setup?clubName=TSV%20Linden%201899&directoryEntryId=dir-e2e-tsv-linden'
- extendedWaitUntil:
    visible: 'Create your club'
    timeout: 10000
- tapOn:
    id: 'club-setup-club-name-input'
- eraseText
- inputText: 'TSV Linden 1899'
- tapOn: 'return'
- tapOn: 'Next'
- extendedWaitUntil:
    visible: 'Add a team'
    timeout: 10000
- tapOn:
    id: 'club-setup-team-name-input'
- inputText: 'First Team'
- tapOn: 'return'
- tapOn: 'Create club'
# The wizard submits a club *claim* now. Nothing is created until Anstoss
# verifies the claimant, so the landing is the verification screen, not the
# admin home. There is no club yet, so no admin dashboard to open.
- extendedWaitUntil:
    visible: 'Club verification in progress'
    timeout: 15000
- assertVisible: 'What happens next'
