appId: com.renuirug.anstoss
---
# MVP FLOW A1: a new club admin sets up a club (one form: club, team, team
# page, optional colour) and lands on home, which shows "Your club is being
# checked" with what happens next and what to prepare (H6).
# Onboarding review fix (H4): a directory result opens the form directly.
- launchApp:
    clearState: false
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: 'anstoss://e2e?scenario=signup-club-admin'
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      notVisible: 'Find your club'
    commands:
      - runFlow:
          file: subflows/deeplink.yaml
          env:
            URL: 'anstoss://e2e?scenario=signup-club-admin'
- extendedWaitUntil:
    visible: 'Find your club'
    timeout: 15000
- tapOn:
    id: 'find-club-search'
- inputText: 'Linden'
- extendedWaitUntil:
    visible: 'TSV Linden 1899'
    timeout: 10000
- tapOn:
    id: 'find-club-row-tsv-linden-1899'
- extendedWaitUntil:
    visible: 'Set up your club'
    timeout: 10000
- tapOn:
    id: 'club-setup-team-name-input'
- inputText: 'First Team'
- tapOn:
    id: 'club-setup-link-input'
- inputText: 'https://www.fussball.de/mannschaft/tsv-linden-1899/-/team-id/011MIFE2E'
- tapOn:
    id: 'club-setup-submit'
- extendedWaitUntil:
    visible: 'Your club is being checked'
    timeout: 15000
- assertVisible: 'What you can prepare now'
- assertVisible:
    id: 'home-verification-details'
