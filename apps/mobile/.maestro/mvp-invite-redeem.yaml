appId: com.renuirug.anstoss
---
# MVP FLOW P2: a signed-in player opens a club invite. Name and DOB are on
# file, so "Join SV Albatros" asks nothing; joining is still one deliberate
# tap on "Join" (onboarding review fix H2: never automatic).
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: 'anstoss://e2e?scenario=signup-player'
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      notVisible: 'Find your club'
    commands:
      - runFlow:
          file: subflows/deeplink.yaml
          env:
            URL: 'anstoss://e2e?scenario=signup-player'
- extendedWaitUntil:
    visible: 'Find your club'
    timeout: 15000
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: 'anstoss://join/sv-albatros/E2EINV01'
- extendedWaitUntil:
    visible: 'Join SV Albatros'
    timeout: 15000
- tapOn:
    id: 'join-confirm'
- extendedWaitUntil:
    visible: '.*(Welcome to SV Albatros|Team chat).*'
    timeout: 15000
