appId: com.renuirug.anstoss
---
# Slice E: the team channel carries the latest announcement, a shared event
# renders as a card with the reply control, and a manager can put an event
# into the chat from the composer.
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=coach"
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://chat"
- extendedWaitUntil:
    visible: "Latest announcement, Kit wash rota starts this week"
    timeout: 15000
- scrollUntilVisible:
    element: "Match, vs. SV Babelsberg 03.*"
    direction: DOWN
    timeout: 15000
- assertVisible: "Yes"
- takeScreenshot: /tmp/claude-501/-Users-yemi/20fbad7e-c058-4f1c-9bff-49c32cad7bb0/scratchpad/chat-coach
- tapOn: "Compose"
- extendedWaitUntil:
    visible: "Add to the chat"
    timeout: 10000
- takeScreenshot: /tmp/claude-501/-Users-yemi/20fbad7e-c058-4f1c-9bff-49c32cad7bb0/scratchpad/chat-compose
- tapOn: "Share event"
- extendedWaitUntil:
    visible: "Which event?"
    timeout: 10000
- tapOn: "Tuesday session.*"
- scrollUntilVisible:
    element: "Training, Tuesday session.*"
    direction: DOWN
    timeout: 15000
- takeScreenshot: /tmp/claude-501/-Users-yemi/20fbad7e-c058-4f1c-9bff-49c32cad7bb0/scratchpad/chat-shared
- tapOn: "Latest announcement, Kit wash rota starts this week"
- extendedWaitUntil:
    visible: ".*Kit wash rota starts this week.*Check the Team tab.*"
    timeout: 10000
