appId: com.renuirug.anstoss
---
# Chat revamp: the inbox lists every conversation; opening the team chat
# shows event, poll and lineup cards; a coach's + menu shares an event;
# the new-chat modal offers "New group" and disables under-16 contacts.
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=coach"
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://chat"
- extendedWaitUntil:
    visible:
      id: "inbox-row-e2e-ch-team"
    timeout: 15000
- takeScreenshot: /tmp/claude-501/-Users-yemi/20fbad7e-c058-4f1c-9bff-49c32cad7bb0/scratchpad/chat-inbox-coach
- tapOn:
    id: "inbox-row-e2e-ch-team"
- extendedWaitUntil:
    visible:
      id: "chat-thread"
    timeout: 15000
- takeScreenshot: /tmp/claude-501/-Users-yemi/20fbad7e-c058-4f1c-9bff-49c32cad7bb0/scratchpad/chat-thread-coach
- tapOn: "Compose|Verfassen"
- tapOn: "Share event|Termin teilen"
- tapOn: "Tuesday session.*"
- back
- tapOn:
    id: "chat-compose"
- extendedWaitUntil:
    visible:
      id: "chat-new-group"
    timeout: 10000
- takeScreenshot: /tmp/claude-501/-Users-yemi/20fbad7e-c058-4f1c-9bff-49c32cad7bb0/scratchpad/chat-new
- assertVisible:
    id: "chat-contact-user-youth-1"
