appId: com.renuirug.anstoss
---
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=club-admin"
# Admin home is the to-do inbox: 10 open tasks + 2 chat reports in the
# club-admin world (2 applications, 4 overdue fees, 1 team without a coach,
# 2 background checks, treasurer vacant).
- extendedWaitUntil:
    visible: ".*open tasks"
    timeout: 15000
- assertVisible: "126 members · 8 teams"
- assertVisible: "Erik Brandt"
# The old /admin-dashboard deep link now lands on the Club (Verein) tab.
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://admin-dashboard"
- runFlow:
    when:
      notVisible: "Member list"
    commands:
      - tapOn: "Club"
- extendedWaitUntil:
    visible: "Member list"
    timeout: 15000
- assertVisible: "Club chair"
- assertVisible: "Membership applications, 2"
- assertVisible: "126"
- scrollUntilVisible:
    element: "Officers & roles"
    direction: DOWN
    timeout: 10000
- scrollUntilVisible:
    element: "Chat history.*"
    direction: DOWN
    timeout: 10000
