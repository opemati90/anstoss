appId: com.renuirug.anstoss
---
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=club-admin"
# Club member count. Home now opens with an identity row (name, team, role),
# which pushes the club stats a little below the fold on smaller devices, so
# scroll to the value rather than assuming it is in the first viewport.
- scrollUntilVisible:
    element: "126"
    direction: DOWN
    timeout: 10000
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://admin-dashboard"
# The admin-dashboard deeplink can be dropped if it fires mid-transition;
# re-fire it once if the Administration screen didn't open.
- runFlow:
    when:
      notVisible: ".*Administration.*"
    commands:
      - runFlow:
          file: subflows/deeplink.yaml
          env:
            URL: "anstoss://admin-dashboard"
- extendedWaitUntil:
    visible: "Administration"
    timeout: 15000
- assertVisible: "Manage teams"
