appId: com.renuirug.anstoss
---
# Signed-out entry: welcome and the email field are one screen. New and
# returning users type their email, tap Continue and land on the code cells.
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=signed-out"
- extendedWaitUntil:
    visible: "Welcome to Anstoss"
    timeout: 10000
- assertVisible: "Email address"
- assertVisible: ".*No club yet\\? Get found as a player.*"
# H5: a parent with a setup code for their child starts here too.
- assertVisible: ".*Got a setup code for your child\\?.*"
- tapOn:
    id: "welcome-email"
- inputText: "signup-flow@example.com"
- tapOn:
    id: "welcome-continue"
- extendedWaitUntil:
    visible: "Enter the code"
    timeout: 15000
- assertVisible: ".*Resend code|New code in.*"
