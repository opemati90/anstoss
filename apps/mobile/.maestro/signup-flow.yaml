appId: com.renuirug.anstoss
---
# Signed-out entry: the welcome hero ("Get started" / "Log in") leads into the
# unified sign-in screen ("Welcome" + phone/email + Send code). Copy updated
# 2026-06-22 (Get started, Welcome).
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=signed-out"
- assertVisible: "Get started"
- assertVisible: "Log in"
- tapOn: "Get started"
- assertVisible: "Welcome"
- assertVisible: "Send code"
