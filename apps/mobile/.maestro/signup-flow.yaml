appId: com.renuirug.anstoss
---
# The full signup journey (account creation -> role -> club create) was rebuilt
# and its old e2e test IDs no longer exist; that deep flow needs a dedicated
# rebuild against the new onboarding. This covers the onboarding -> auth entry.
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=signed-out"
- assertVisible: "Build your profile"
- assertVisible: "Log in"
- tapOn: "Log in"
- assertVisible: "Welcome back"
