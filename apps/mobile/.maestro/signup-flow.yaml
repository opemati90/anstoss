appId: com.renuirug.anstoss
---
- launchApp:
    clearState: true
- openLink: "exp+anstoss://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8084"
- assertVisible: "Continue"
- tapOn: "Continue"
- assertVisible: "Go home"
- tapOn:
    point: "95%,43%"
- openLink: "anstoss://e2e?scenario=signed-out"
- assertVisible: "Your club. Everything in one place."
- openLink: "anstoss://sign-in?mode=signup&e2eBypass=1"
- assertVisible: "Continue"
- tapOn:
    id: "auth-email-input"
- inputText: "admin@anstoss.dev"
- tapOn:
    id: "auth-primary-action"
- assertVisible: "Code"
- tapOn:
    id: "auth-code-input"
- inputText: "123456"
- tapOn: "Anstoss"
- tapOn:
    id: "auth-primary-action"
- assertVisible: "I run a club"
- tapOn: "I run a club"
- scrollUntilVisible:
    element: "Continue"
    direction: DOWN
- tapOn: "Continue"
- assertVisible: "Create your club"
