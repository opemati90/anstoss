appId: com.renuirug.anstoss
---
# WRITE FLOW J7: Free agent accepts a trial invite.
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=free-agent"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://invites"
- extendedWaitUntil:
    visible: ".*(Zusagen|Accept|SV Albatros).*"
    timeout: 15000
- takeScreenshot: "24-trial-before"
- tapOn: ".*(Probetraining bei SV Albatros zusagen|Accept the trial at SV Albatros).*"
- extendedWaitUntil:
    visible: ".*(Zugesagt|You’re in).*"
    timeout: 10000
- takeScreenshot: "25-trial-after"
