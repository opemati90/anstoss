appId: com.renuirug.anstoss
---
# Smoke test of the merged welcome + email screen. Force signed-out first so a
# persisted session does not resume into the app.
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: 'anstoss://e2e?scenario=signed-out'
- extendedWaitUntil:
    visible: 'Welcome to Anstoss'
    timeout: 10000
- assertVisible: 'Email address'
- assertVisible: 'Continue'
# Consent line is always visible above the keyboard, with both policy links.
- assertVisible: '.*By tapping “Continue” you agree.*'
- assertVisible: 'Terms of Use'
- assertVisible: 'Privacy'
