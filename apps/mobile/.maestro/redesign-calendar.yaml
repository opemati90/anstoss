appId: com.renuirug.anstoss
---
- openLink: 'exp+anstoss://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8123'
- runFlow:
    when:
      visible: 'Development Build'
    commands:
      - tapOn:
          text: '.*:8123'
          index: 0
- waitForAnimationToEnd:
    timeout: 10000
- evalScript: ${output.dayKey = function(offset) { var d = new Date(); d.setDate(d.getDate() + offset); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }; output.matchDay = output.dayKey((7 - new Date().getDay()) % 7 || 7); output.emptyDay = output.dayKey(7);}
- evalScript: >-
    ${output.scenario = typeof SCENARIO === 'undefined' ? 'coach' : SCENARIO;
    output.homeId = output.scenario === 'player' ? 'home-hero-rsvp' : 'coach-hero';}
- openLink: 'anstoss://e2e?scenario=${output.scenario}&lang=de'
- extendedWaitUntil:
    visible:
      id: ${output.homeId}
    timeout: 30000
- openLink: 'anstoss://events'
- extendedWaitUntil:
    visible:
      id: events-week
    timeout: 15000
- assertVisible: 'Keine Termine an diesem Tag'
- tapOn:
    id: ${'events-day-' + output.matchDay}
- assertVisible: '.*bei FC Stahl Brandenburg.*'
- assertNotVisible: '.*Tuesday session.*'
- takeScreenshot: /private/tmp/anstoss-${output.scenario}-calendar-selected-20261114
- tapOn: '.*bei FC Stahl Brandenburg.*'
- extendedWaitUntil:
    visible:
      id: event-back
    timeout: 15000
- tapOn:
    id: event-back
- tapOn:
    id: events-clear-day
- swipe:
    start: '85%,24%'
    end: '20%,24%'
    duration: 600
- waitForAnimationToEnd
- tapOn:
    id: ${'events-day-' + output.emptyDay}
- assertVisible: 'Keine Termine an diesem Tag'
- tapOn:
    id: events-clear-day
- assertVisible: '.*bei FC Stahl Brandenburg.*'
