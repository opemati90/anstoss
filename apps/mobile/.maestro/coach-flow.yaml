appId: com.renuirug.anstoss
---
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: 'anstoss://e2e?scenario=coach'
- assertVisible: 'Open squad'
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: 'anstoss://roster?tab=operations'
- assertVisible: 'Trials'
- assertVisible: 'Jonas Wagner'
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: 'anstoss://roster?tab=medic'
- assertVisible: 'Active injuries'
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: 'anstoss://roster?tab=kit'
- assertVisible: 'Pending cleanup'
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: 'anstoss://events'
- assertVisible: 'Events'
- assertVisible: 'Upcoming'
