appId: com.renuirug.anstoss
---
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: 'anstoss://e2e?scenario=coach'
# Coach home leads with the next match card (readiness split + reminder).
- extendedWaitUntil:
    visible: 'Next match'
    timeout: 15000
# Kader revamp: the roster workspace is gone; the Kader tab carries the
# squad, the open requests and the team tools (see coach-team-tab.yaml).
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: 'anstoss://squad'
- extendedWaitUntil:
    visible:
      id: 'kader-requests-banner'
    timeout: 15000
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: 'anstoss://aufgaben'
- assertVisible: 'Duties'
- assertVisible: 'Assign the next round'
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: 'anstoss://events'
- assertVisible: 'Events'
- assertVisible: 'Upcoming'
