appId: com.renuirug.anstoss
---
# Capture the live match screen by tapping the home live-match card, which
# carries the seeded match id (the raw deeplink has none → error state).
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=player"
- extendedWaitUntil:
    visible: ".*vs.*live.*"
    timeout: 15000
- tapOn: ".*vs.*live.*"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: "03-player-match"
