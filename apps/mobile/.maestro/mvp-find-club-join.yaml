appId: com.renuirug.anstoss
---
# MVP FLOW P1: a new player finds an active club, picks "Player" right on the
# club row and lands on "Request sent" (screen 4 of 4 + waiting screen).
# Onboarding review fix (H4): no separate role screen; the send tap is on
# Verein finden.
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: 'anstoss://e2e?scenario=signup-player'
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      notVisible: 'Find your club'
    commands:
      - runFlow:
          file: subflows/deeplink.yaml
          env:
            URL: 'anstoss://e2e?scenario=signup-player'
- extendedWaitUntil:
    visible: 'Find your club'
    timeout: 15000
- tapOn:
    id: 'find-club-search'
- inputText: 'Albatros'
- extendedWaitUntil:
    visible: 'SV Albatros'
    timeout: 10000
- tapOn:
    id: 'find-club-row-sv-albatros'
- extendedWaitUntil:
    visible: 'How are you involved?'
    timeout: 10000
- assertVisible: 'Find your club'
- tapOn:
    id: 'club-role-player'
# The date of birth was given on "What's your name?", never here.
- assertNotVisible:
    id: 'dob-day'
- assertVisible: '.*The coach usually confirms you within a day.*'
- tapOn:
    id: 'club-send-request'
- extendedWaitUntil:
    visible: 'Request sent'
    timeout: 10000
- assertVisible: 'Send a reminder'
- assertVisible: 'Withdraw request'
- tapOn:
    id: 'pending-check'
- extendedWaitUntil:
    visible: 'Not confirmed yet.*'
    timeout: 10000
