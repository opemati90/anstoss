appId: com.renuirug.anstoss
---
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=free-agent"
- extendedWaitUntil:
    visible: ".*(Gesuche|Player searches|Searches near you).*"
    timeout: 15000
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://invites"
- assertVisible: ".*(Probetrainings|Trials).*"
