appId: com.renuirug.anstoss
---
# MVP FLOW P3: Player can see GDPR controls and complete account deletion.
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: 'anstoss://e2e?scenario=player'
- extendedWaitUntil:
    visible: 'Team chat'
    timeout: 15000
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: 'anstoss://more'
# Scroll to the row we are going to tap, and centre it. Anchoring on
# "Export my data" stopped as soon as that row peeked out above the tab bar,
# leaving "Delete account" underneath the bar, where the tap was swallowed and
# the confirm alert never appeared.
- scrollUntilVisible:
    element:
      text: 'Delete account'
    direction: DOWN
    centerElement: true
    timeout: 15000
- assertVisible: 'Export my data'
- assertVisible: 'Legal'
- tapOn: 'Delete account'
- extendedWaitUntil:
    visible: "Delete your account\\?"
    timeout: 10000
- tapOn: 'Delete permanently'
- extendedWaitUntil:
    visible: 'Get started'
    timeout: 15000
