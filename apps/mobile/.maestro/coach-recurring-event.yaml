appId: com.renuirug.anstoss
---
# Recurring events (events revamp): a coach opens "New event", which starts as
# a weekly training until the end of the season, names it, saves the series,
# finds it in the schedule, and cancels "this and all following" from the
# event screen's header menu.
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=coach"
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://create-event"
- extendedWaitUntil:
    visible: "New event"
    timeout: 15000
- assertVisible: "Repeat: Weekly"
- tapOn:
    id: "event-title-input"
- inputText: "Weekly session"
- tapOn: "done"
- takeScreenshot: /tmp/claude-501/-Users-yemi/20fbad7e-c058-4f1c-9bff-49c32cad7bb0/scratchpad/recurring-form
- tapOn:
    id: "event-create-submit"
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://events"
- extendedWaitUntil:
    visible: "Upcoming"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Weekly session.*"
    direction: DOWN
    timeout: 20000
- takeScreenshot: /tmp/claude-501/-Users-yemi/20fbad7e-c058-4f1c-9bff-49c32cad7bb0/scratchpad/recurring-schedule
- tapOn:
    text: "Weekly session.*"
    index: 0
- extendedWaitUntil:
    visible: ".*Every week until.*"
    timeout: 15000
- takeScreenshot: /tmp/claude-501/-Users-yemi/20fbad7e-c058-4f1c-9bff-49c32cad7bb0/scratchpad/recurring-detail
- tapOn:
    id: "event-manage-menu"
- tapOn:
    id: "event-menu-cancel"
- extendedWaitUntil:
    visible: "This and all following"
    timeout: 10000
- tapOn: "This and all following"
- tapOn:
    id: "event-cancel-confirm"
- extendedWaitUntil:
    visible: "Cancelled"
    timeout: 10000
- tapOn: "Back"
- extendedWaitUntil:
    visible: "Upcoming"
    timeout: 10000
- takeScreenshot: /tmp/claude-501/-Users-yemi/20fbad7e-c058-4f1c-9bff-49c32cad7bb0/scratchpad/recurring-cancelled
