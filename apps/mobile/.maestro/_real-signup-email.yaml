appId: com.renuirug.anstoss
---
# Real auth via EMAIL (Clerk test address + magic code 424242). Isolates whether
# the post-OTP "couldn't finish" failure is phone-specific (Clerk requiring an
# email to complete signup) or affects all identifiers.
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=signed-out"
- extendedWaitUntil:
    visible: "Welcome to Anstoss"
    timeout: 10000
- tapOn:
    id: "welcome-email"
- inputText: "smoke622+clerk_test@example.com"
- tapOn:
    id: "welcome-continue"
- extendedWaitUntil:
    visible: ".*Enter the code.*"
    timeout: 12000
- inputText: "424242"
- extendedWaitUntil:
    visible: ".*(What’s your name|Find your club|Request sent|Home|couldn).*"
    timeout: 20000
