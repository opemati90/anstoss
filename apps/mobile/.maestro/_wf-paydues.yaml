appId: com.renuirug.anstoss
---
# WRITE FLOW J6: Player reports an overdue contribution payment.
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=player"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://my-contributions"
- extendedWaitUntil:
    visible: "Report payment"
    timeout: 15000
- takeScreenshot: "22-paydues-before"
- tapOn:
    text: "Report payment"
    index: 0
# Native confirm alert
- tapOn:
    text: "Report payment"
    index: 0
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: "23-paydues-after"
