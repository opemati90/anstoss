appId: com.renuirug.anstoss
---
# Destructive only to the fictional isolated QA player, after removal.
- tapOn: 'Mehr'
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      text: 'Konto löschen'
    direction: DOWN
    centerElement: true
- tapOn: 'Konto löschen'
- assertVisible: 'Konto löschen\?'
- tapOn: 'Endgültig löschen'
- extendedWaitUntil:
    visible:
      id: welcome-sign-in
    timeout: 30000
- takeScreenshot: /private/tmp/anstoss-connected-player-deleted
