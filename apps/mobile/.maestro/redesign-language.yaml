appId: com.renuirug.anstoss
---
- openLink: 'exp+anstoss://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8123'
- runFlow:
    when:
      visible: 'Development Build'
    commands:
      - tapOn:
          text: '.*:8123'
          index: 0
- waitForAnimationToEnd:
    timeout: 10000
- openLink: 'anstoss://e2e?scenario=coach&lang=de'
- extendedWaitUntil:
    visible:
      id: coach-hero
    timeout: 30000
- openLink: 'anstoss://language'
- extendedWaitUntil:
    visible:
      id: language-en
    timeout: 15000
- assertVisible:
    id: language-de
- assertVisible:
    id: language-fr
- assertVisible:
    id: language-pt
- assertVisible:
    id: language-it
- assertVisible:
    id: language-tr
- tapOn:
    id: language-en
- assertVisible: 'Events, availability, lineups, chat and dues in one place.'
- assertVisible: 'Join a club'
- assertNotVisible: 'Termine, Zusagen, Aufstellung, Chat und Beiträge an einem Ort.'
- tapOn:
    id: language-apply
- extendedWaitUntil:
    visible: 'Before the match'
    timeout: 15000
- openLink: 'anstoss://language'
- tapOn:
    id: language-de
- tapOn:
    id: language-apply
- extendedWaitUntil:
    visible: 'VOR DEM SPIEL'
    timeout: 15000
