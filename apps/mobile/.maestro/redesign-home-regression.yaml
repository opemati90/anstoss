appId: com.renuirug.anstoss
---
- openLink: 'exp+anstoss://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8123'
- runFlow:
    when:
      visible: 'Development Build'
    commands:
      - tapOn:
          text: '.*:8123'
          index: 0
- waitForAnimationToEnd:
    timeout: 10000
- openLink: 'anstoss://e2e?scenario=player&lang=de'
- extendedWaitUntil:
    visible:
      id: home-hero-rsvp
    timeout: 30000
- assertVisible: '.*Auswärts.*'
- tapOn:
    id: home-hero-rsvp-MAYBE
- tapOn:
    id: home-hero-rsvp-NO
- extendedWaitUntil:
    visible:
      id: absence-cancel
    timeout: 10000
- tapOn:
    id: absence-cancel
- tapOn:
    id: home-hero-rsvp-YES
- extendedWaitUntil:
    visible: 'Zugesagt. Du bist einer von .*'
    timeout: 10000
- takeScreenshot: /private/tmp/anstoss-player-confirmed-20261114
- tapOn:
    id: player-home-awaiting
- extendedWaitUntil:
    visible:
      id: events-week
    timeout: 15000
- openLink: 'anstoss://e2e?scenario=coach&lang=de'
- extendedWaitUntil:
    visible:
      id: coach-hero
    timeout: 30000
- openLink: 'anstoss://squad'
- extendedWaitUntil:
    visible:
      id: kader-summary
    timeout: 15000
- takeScreenshot: /private/tmp/anstoss-coach-squad-20261114
