appId: com.renuirug.anstoss
---
- runFlow: subflows/launch.yaml
# Signed-out → welcome (new full-bleed hero)
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=signed-out"
- extendedWaitUntil:
    visible: ".*(Welcome to Anstoss|Email address).*"
    timeout: 25000
- takeScreenshot: "90-welcome"
# Welcome and the email field are one screen now; "Continue" sends the code.
- tapOn:
    id: "welcome-email"
- inputText: "smoke-redesign@example.com"
- tapOn:
    id: "welcome-continue"
- extendedWaitUntil:
    visible: ".*Enter the code.*"
    timeout: 15000
- takeScreenshot: "91-signin"
# Player journey
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=player"
- extendedWaitUntil:
    visible: ".*(DO THIS NEXT|Match is live|Babelsberg|Today).*"
    timeout: 15000
- takeScreenshot: "92-player-home"
# Admin journey
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=club-admin"
- extendedWaitUntil:
    visible: ".*(Members|CONTRIBUTIONS|Babelsberg|Remind).*"
    timeout: 15000
- takeScreenshot: "93-admin-home"
