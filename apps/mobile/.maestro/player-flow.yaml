appId: com.renuirug.anstoss
---
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=player"
# The live card is one accessibility element with its own label, so its inner
# "Open live match" text is (correctly) not individually queryable. Assert the
# label a screen reader would actually read.
- assertVisible: ".*vs.*live.*"
- assertVisible: "Team chat"
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://events"
- assertVisible: "Events"
- assertVisible: "Upcoming"
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://more"
- assertVisible: "ACCOUNT"
- assertVisible: "Profile"
