appId: com.renuirug.anstoss
---
- runFlow: subflows/launch.yaml
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://e2e?scenario=player"
- assertVisible: "Open live match"
- assertVisible: "Team chat"
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://events"
- assertVisible: "Events"
- assertVisible: "Upcoming"
- runFlow:
    file: subflows/deeplink.yaml
    env:
      URL: "anstoss://more"
- assertVisible: "ACCOUNT"
- assertVisible: "Profile"
