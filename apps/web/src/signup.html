<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anstoss Club Pilot</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page narrow">
      <section class="panel">
        <p class="eyebrow">Club signup intake</p>
        <h1>Request a club pilot</h1>
        <form class="signup-form">
          <label>Club name<input placeholder="SV Musterstadt" /></label>
          <label>Contact email<input placeholder="coach@club.de" /></label>
          <label>Current pain point<textarea rows="4" placeholder="We manage RSVPs and reminders in WhatsApp."></textarea></label>
          <button class="button" type="button">Submit intake</button>
        </form>
      </section>
    </main>
  </body>
</html>
