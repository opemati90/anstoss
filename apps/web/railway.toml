# Railway service config for the Anstoss marketing site.
# Add this as a new service in the Anstoss Railway project pointing at
# this directory (apps/web). nginx serves the static site on $PORT.

[build]
# Path is relative to the service's Root Directory, which must be set to
# `apps/web/` in the Railway dashboard (Settings → Source → Root Directory).
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
