server {
  listen       ${PORT};
  server_name  _;

  root   /usr/share/nginx/html;
  index  index.html;

  # Long cache for fingerprinted-ish static assets, short cache for HTML.
  location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "public, max-age=300, must-revalidate";
    try_files $uri $uri/ $uri.html /index.html;
  }

  # Apple App Site Association — must be served as application/json with no
  # redirect. Apple's CDN fetches this on first install to verify the app can
  # handle https://anstoss.io/join/* as a universal link.
  location = /.well-known/apple-app-site-association {
    add_header Content-Type "application/json";
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # Health endpoint for Railway's healthcheck.
  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Hide nginx version in error pages / Server header.
  server_tokens off;

  # Reasonable defaults for a static site.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
