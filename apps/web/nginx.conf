server {
  listen       ${PORT};
  server_name  _;

  root   /usr/share/nginx/html;
  index  index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://anstoss-api-production.up.railway.app" always;

  # Long cache for fingerprinted-ish static assets, short cache for HTML.
  location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|woff2?)$ {
    expires 7d;
    try_files $uri =404;
  }

  location / {
    expires 5m;
    try_files $uri $uri/ $uri.html /index.html;
  }

  # Apple App Site Association — must be served as application/json with no
  # redirect. Apple's CDN fetches this on first install to verify the app can
  # handle https://anstoss.io/join/* as a universal link.
  location = /.well-known/apple-app-site-association {
    default_type application/json;
    expires 1h;
    try_files $uri =404;
  }

  # Health endpoint for Railway's healthcheck.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Hide nginx version in error pages / Server header.
  server_tokens off;

  # Reasonable defaults for a static site.
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
