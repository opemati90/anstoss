# Local development stack — Postgres, Redis, LibreTranslate.
# Run: docker compose up -d
# The API and mobile run outside compose (npm run dev) for hot-reload speed.
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anstoss
      POSTGRES_PASSWORD: anstoss
      POSTGRES_DB: anstoss
    ports:
      - "5432:5432"
    volumes:
      - anstoss_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  libretranslate:
    build:
      context: ./libretranslate
    environment:
      LT_LOAD_ONLY: de,en,fr,pt,it,tr,ar
      LT_DISABLE_FILES_TRANSLATION: "true"
      LT_DISABLE_WEB_UI: "true"
      LT_CHAR_LIMIT: "2000"
    ports:
      - "5005:5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/languages"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

volumes:
  anstoss_pg:
