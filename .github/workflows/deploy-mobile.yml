name: Build Mobile

# Mobile builds are MANUAL ONLY for the develop branch — push a build only
# when explicitly requested via "Run workflow" in the GitHub Actions tab,
# the gh CLI (`gh workflow run "Build Mobile" --ref develop`), or by
# pushing to `prod`. Pushing to `develop` no longer triggers TestFlight or
# the Android preview automatically.
on:
  push:
    branches:
      - prod
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - '.github/workflows/deploy-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  build-preview:
    name: EAS Preview Build
    # Only on manual dispatch against develop — never on auto-push.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    concurrency:
      group: eas-preview-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Trigger preview build (Android)
        run: eas build --platform android --profile preview --non-interactive --no-wait
        working-directory: apps/mobile
        continue-on-error: true

  build-testflight:
    name: EAS TestFlight Build (iOS)
    # Only on manual dispatch against develop — never on auto-push.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    concurrency:
      group: eas-testflight-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build and submit to TestFlight
        run: eas build --platform ios --profile testflight --non-interactive --auto-submit --no-wait
        working-directory: apps/mobile

  build-production:
    name: EAS Production Build
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: eas-production-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Trigger production build
        run: eas build --platform all --profile production --non-interactive --no-wait
        working-directory: apps/mobile
