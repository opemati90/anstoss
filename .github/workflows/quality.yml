name: Quality Gates

on:
  pull_request:
    branches:
      - develop
      - prod
  push:
    branches:
      - develop
      - prod
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Run typecheck
        run: npm run typecheck

  shared-tests:
    name: Shared Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run shared tests
        run: npm test --workspace=@anstoss/shared

  mobile-tests:
    name: Mobile Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mobile tests with coverage
        # Two bounded workers isolate React Native test environments and avoid
        # the severe single-process GC/timer degradation seen on hosted runners.
        # Coverage is still collected and enforced across the complete suite.
        run: npx jest --config ./jest.config.js --coverage --maxWorkers=2 --forceExit --testTimeout=30000
        working-directory: apps/mobile

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/anstoss_test
      DATABASE_URL_DIRECT: postgresql://test:test@localhost:5432/anstoss_test
      CLERK_SECRET_KEY: test_clerk_secret
      UPSTASH_REDIS_URL: https://example.upstash.io
      UPSTASH_REDIS_TOKEN: test_token
      JEST_DISABLE_WATCHMAN: 1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: anstoss_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: apps/api

      - name: Run API tests with coverage
        run: npx jest --coverage --runInBand
        working-directory: apps/api

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Run build
        run: npm run build
