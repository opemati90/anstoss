name: Deploy API

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - 'turbo.json'
      - 'railway.toml'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: true

jobs:
  deploy-development:
    name: Deploy API (Development)
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: development
    concurrency:
      group: deploy-api-development
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy to Railway development
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_API_SERVICE }}
        run: railway up --service "$RAILWAY_SERVICE" --ci

  deploy-production:
    name: Deploy API (Production)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-api-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Deploy to Railway production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_API_SERVICE }}
        run: railway up --service "$RAILWAY_SERVICE" --ci
