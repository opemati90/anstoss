<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kasse</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;600;700&amp;display=swap">
<style>body{margin:0}a{color:#0E3B2B}a:hover{color:#121A15}
.scr{width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;background:#F6F5F1;color:#121A15;font-family:Inter,"IBM Plex Sans Arabic",system-ui,sans-serif}
.pad{padding:60px 20px 108px;display:flex;flex-direction:column;gap:24px}
.h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-0.025em;line-height:1.1}
.disp{font-family:"Barlow Condensed","IBM Plex Sans Arabic",sans-serif;font-weight:700;text-transform:uppercase;line-height:0.95}
.lbl{margin:0;font-size:12px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:#5B675F}
.mut{color:#5B675F}
.num{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.grp{background:#FFFFFF;border-radius:20px;padding:0 16px;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 0;box-sizing:border-box;border-bottom:1px solid #EDEBE4;text-decoration:none;color:#121A15;background:none;border-left:none;border-right:none;border-top:none;font-family:inherit;text-align:start;width:100%;cursor:pointer}
.row.last{border-bottom:none}
.ib{width:44px;height:44px;border-radius:22px;background:#FFFFFF;border:none;box-shadow:inset 0 0 0 1px #E4E2DA;display:flex;align-items:center;justify-content:center;color:#121A15;cursor:pointer;flex-shrink:0;text-decoration:none;position:relative}
.ib.dark{background:rgba(255,255,255,0.12);box-shadow:none;color:#FFFFFF}
.btn{height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;text-decoration:none;border:none;cursor:pointer;font-family:inherit;width:100%;box-sizing:border-box}
.pri{background:#121A15;color:#FFFFFF}.acc{background:#D4F25C;color:#121A15}.sec{background:transparent;color:#121A15;box-shadow:inset 0 0 0 1px #CFCDC4}
.sm{height:36px;padding:0 14px;border-radius:18px;font-size:13px;width:auto}
.chip{height:36px;padding:0 14px;border-radius:18px;font-size:13px;font-weight:600;border:none;box-shadow:inset 0 0 0 1px #D9D7CE;background:transparent;color:#121A15;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:#121A15;color:#FFFFFF;box-shadow:none}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#ECEAE3;border-radius:16px;padding:4px}
.sg{height:44px;border-radius:12px;border:none;background:transparent;color:#5B675F;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}
.sg.on{background:#FFFFFF;color:#121A15;box-shadow:0 1px 3px rgba(18,26,21,0.12)}
.av{width:36px;height:36px;border-radius:18px;background:#E8E6DE;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#121A15}
.ic{width:40px;height:40px;border-radius:12px;background:#F1EFE9;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#121A15}
.tag{font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap}
.fld{width:100%;height:52px;box-sizing:border-box;border-radius:14px;border:none;box-shadow:inset 0 0 0 1px #DEDCD3;background:#FFFFFF;padding:0 16px;font-family:inherit;font-size:16px;color:#121A15}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;box-sizing:border-box;padding:8px 8px 24px;background:#FFFFFF;box-shadow:0 -1px 0 #E4E2DA;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#5B675F;font-size:11px;font-weight:500}
.tab::after{content:"";width:4px;height:4px;border-radius:2px;background:transparent}
.tab.on{color:#121A15;font-weight:700}.tab.on::after{background:#121A15}
.stat{display:flex;flex-direction:column;gap:4px}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px}</style>
</helmet>
<div class="scr">
  <div class="pad" style="gap: 20px">
    <header style="display: flex; align-items: center; gap: 12px"><a href="More.dc.html" class="ib" aria-label="Zurück"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M15 5l-7 7 7 7"></path></svg></a><h1 class="h1" style="flex: 1; font-size: 26px">Beiträge</h1><button class="chip">November<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" ><path d="M6 9l6 6 6-6"></path></svg></button></header>
    <div style="background: #121A15; color: #FFFFFF; border-radius: 28px; padding: 22px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; justify-content: space-between; align-items: flex-end">
        <div class="stat"><span style="font-size: 13px; color: #A9B8B0">Eingegangen</span><span class="num" style="font-size: 52px; line-height: 1">{{inS}}</span></div>
        <div class="stat" style="align-items: flex-end"><span style="font-size: 13px; color: #A9B8B0">Offen</span><span class="num" style="font-size: 30px; line-height: 1">{{outS}}</span></div>
      </div>
      <div class="bar" role="img" aria-label="Bezahlt-Anteil"><span style="flex: {{paidN}}; background: #FFFFFF"></span><span style="flex: {{openN}}; background: rgba(255,255,255,0.18)"></span></div>
      <div style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 13px; color: #C9D6CF">{{paidN}} von 22 · 25 € im Monat</span><button onClick="{{nudge}}" class="btn acc sm">{{nudgeLabel}}</button></div>
    </div>
    <div role="tablist" aria-label="Filter" class="seg"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="3"><button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" class="{{t.cls}}">{{t.label}}</button></sc-for></div>
    <div class="grp"><sc-for list="{{rows}}" as="r" hint-placeholder-count="4"><div class="{{r.cls}}"><span class="av">{{r.ini}}</span><span style="flex: 1; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 600">{{r.name}} <span class="num" style="font-size: 16px; font-weight: 700">{{r.amt}}</span></span><span style="font-size: 12px" class="mut">{{r.meta}}</span><span style="{{r.tagS}}; align-self: flex-start">{{r.st}}</span></span><sc-if value="{{r.canMark}}" hint-placeholder-val="{{ true }}"><button onClick="{{r.mark}}" class="btn sec sm">{{r.markLabel}}</button></sc-if></div></sc-for></div>
    <div class="grp"><button class="row last"><span class="ic"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M3 10h18M9 10v10"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Kontoauszug abgleichen</span><span style="font-size: 12px" class="mut">CSV oder CAMT aus dem Online-Banking</span></span><span class="mut" style="display: flex"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M9 6l6 6-6 6"></path></svg></span></button></div>
    <p style="margin: 0; font-size: 13px; line-height: 1.5" class="mut">Anstoss zieht kein Geld ein. Mitglieder überweisen direkt aufs Vereinskonto, du siehst hier nur den Stand.</p>
  </div>
  <nav aria-label="Hauptnavigation" class="tabs" style="grid-template-columns: repeat(5, minmax(0, 1fr))"><a href="Home.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg>Start</a><a href="Calendar.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Termine</a><a href="Chat.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ><path d="M4 5h16v11H8l-4 4z"></path></svg>Chat</a><a href="Squad.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.5 3.5 5.2"></path></svg>Kader</a><a href="More.dc.html" class="tab on" aria-current="page"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" ><circle cx="5" cy="12" r="1.2"></circle><circle cx="12" cy="12" r="1.2"></circle><circle cx="19" cy="12" r="1.2"></circle></svg>Mehr</a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"club": {"editor": "color", "default": "#0E3B2B", "options": ["#0E3B2B", "#7A1F2B", "#123A5C", "#1F2A44"], "section": "Vereinsfarbe"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { t: "open", nudged: false, paid: {} }; }
  renderVals() {
    const all = [["MY","Mert Yılmaz","Seit 12.11. fällig","25 €","Überfällig","open"],["SK","Sinan Kaya","Meldet: überwiesen am 12.11.","25 €","Gemeldet","open"],["PK","Paul Krüger","Trikotumlage","45 €","Überfällig","open"],["JW","Jonas Wagner","Fällig 15.11.","25 €","Offen","open"],["LB","Lukas Becker","Kontoauszug · 01.11.","25 €","Bezahlt","paid"],["KO","Kofi Osei","Bar beim Training · 03.11.","25 €","Bezahlt","paid"]];
    const rows0 = all.map((r) => this.state.paid[r[1]] ? [r[0], r[1], "Von dir bestätigt", r[3], "Bezahlt", "paid"] : r);
    const vis = rows0.filter((r) => this.state.t === "all" || r[5] === this.state.t);
    const rows = vis.map(([ini,name,meta,amt,st], i) => ({ ini, name, meta, amt, st, cls: "row" + (i === vis.length - 1 ? " last" : ""), canMark: st !== "Bezahlt", markLabel: st === "Gemeldet" ? "Bestätigen" : "Bezahlt",
      mark: () => { const paid = Object.assign({}, this.state.paid); paid[name] = true; this.setState({ paid }); },
      tagS: "font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 8px; " + (st === "Überfällig" ? "background: #FBE4D8; color: #8A2C0D" : st === "Bezahlt" ? "background: #EEF1E6; color: #2E3B13" : "background: #F1EFE9; color: #3E4A43") }));
    const nOpen = rows0.filter((r) => r[5] === "open").length;
    const tabs = [["open","Offen · " + nOpen],["paid","Bezahlt · " + (22 - nOpen)],["all","Alle"]].map(([id,label]) => ({ label, on: this.state.t === id ? "true" : "false", cls: "sg" + (this.state.t === id ? " on" : ""), pick: () => this.setState({ t: id }) }));
    return { tabs, rows, nudge: () => this.setState({ nudged: true }), nudgeLabel: this.state.nudged ? "Erinnert" : nOpen + " erinnern", paidN: 22 - nOpen, openN: nOpen, inS: (22 - nOpen) * 25 + " €", outS: nOpen * 25 + " €" };
  }
}
</script>
</body>
</html>
