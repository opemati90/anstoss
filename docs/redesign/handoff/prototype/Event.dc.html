<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Termin – Ligaspiel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;600;700&amp;display=swap">
<style>body{margin:0}a{color:#0E3B2B}a:hover{color:#121A15}
.scr{width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;background:#F6F5F1;color:#121A15;font-family:Inter,"IBM Plex Sans Arabic",system-ui,sans-serif}
.pad{padding:60px 20px 108px;display:flex;flex-direction:column;gap:24px}
.h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-0.025em;line-height:1.1}
.disp{font-family:"Barlow Condensed","IBM Plex Sans Arabic",sans-serif;font-weight:700;text-transform:uppercase;line-height:0.95}
.lbl{margin:0;font-size:12px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:#5B675F}
.mut{color:#5B675F}
.num{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.grp{background:#FFFFFF;border-radius:20px;padding:0 16px;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 0;box-sizing:border-box;border-bottom:1px solid #EDEBE4;text-decoration:none;color:#121A15;background:none;border-left:none;border-right:none;border-top:none;font-family:inherit;text-align:start;width:100%;cursor:pointer}
.row.last{border-bottom:none}
.ib{width:44px;height:44px;border-radius:22px;background:#FFFFFF;border:none;box-shadow:inset 0 0 0 1px #E4E2DA;display:flex;align-items:center;justify-content:center;color:#121A15;cursor:pointer;flex-shrink:0;text-decoration:none;position:relative}
.ib.dark{background:rgba(255,255,255,0.12);box-shadow:none;color:#FFFFFF}
.btn{height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;text-decoration:none;border:none;cursor:pointer;font-family:inherit;width:100%;box-sizing:border-box}
.pri{background:#121A15;color:#FFFFFF}.acc{background:#D4F25C;color:#121A15}.sec{background:transparent;color:#121A15;box-shadow:inset 0 0 0 1px #CFCDC4}
.sm{height:36px;padding:0 14px;border-radius:18px;font-size:13px;width:auto}
.chip{height:36px;padding:0 14px;border-radius:18px;font-size:13px;font-weight:600;border:none;box-shadow:inset 0 0 0 1px #D9D7CE;background:transparent;color:#121A15;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:#121A15;color:#FFFFFF;box-shadow:none}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#ECEAE3;border-radius:16px;padding:4px}
.sg{height:44px;border-radius:12px;border:none;background:transparent;color:#5B675F;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}
.sg.on{background:#FFFFFF;color:#121A15;box-shadow:0 1px 3px rgba(18,26,21,0.12)}
.av{width:36px;height:36px;border-radius:18px;background:#E8E6DE;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#121A15}
.ic{width:40px;height:40px;border-radius:12px;background:#F1EFE9;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#121A15}
.tag{font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap}
.fld{width:100%;height:52px;box-sizing:border-box;border-radius:14px;border:none;box-shadow:inset 0 0 0 1px #DEDCD3;background:#FFFFFF;padding:0 16px;font-family:inherit;font-size:16px;color:#121A15}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;box-sizing:border-box;padding:8px 8px 24px;background:#FFFFFF;box-shadow:0 -1px 0 #E4E2DA;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#5B675F;font-size:11px;font-weight:500}
.tab::after{content:"";width:4px;height:4px;border-radius:2px;background:transparent}
.tab.on{color:#121A15;font-weight:700}.tab.on::after{background:#121A15}
.stat{display:flex;flex-direction:column;gap:4px}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px}</style>
</helmet>
<div class="scr">
  <div style="background: {{club}}; color: #FFFFFF; padding: 60px 20px 26px; display: flex; flex-direction: column; gap: 22px; position: relative; overflow: hidden">
    <svg aria-hidden="true" width="320" height="320" viewBox="0 0 320 320" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="1.5" style="position: absolute; right: -120px; bottom: -170px"><circle cx="160" cy="160" r="110"></circle><path d="M0 160h320"></path></svg>
    <div style="display: flex; justify-content: space-between; position: relative"><a href="Calendar.dc.html" class="ib dark" aria-label="Zurück"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M15 5l-7 7 7 7"></path></svg></a><button class="ib dark" aria-label="Teilen"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 15V3M7 8l5-5 5 5M5 13v7h14v-7"></path></svg></button></div>
    <div style="display: flex; flex-direction: column; gap: 8px; position: relative"><span style="font-size: 13px; font-weight: 600; color: #C9D6CF">Kreisliga C · 11. Spieltag</span><h1 class="disp" style="margin: 0; font-size: 40px">vs. Rot-Weiß<br>Köpenick III</h1></div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); position: relative">
      <div class="stat"><span style="font-size: 12px; color: #C9D6CF">Sonntag</span><span class="num" style="font-size: 24px">15.11.</span></div>
      <div class="stat"><span style="font-size: 12px; color: #C9D6CF">Anpfiff</span><span class="num" style="font-size: 24px">14:00</span></div>
      <div class="stat"><span style="font-size: 12px; color: #C9D6CF">Treffpunkt</span><span class="num" style="font-size: 24px">13:00</span></div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 20px; padding: 20px 20px 120px">
    <div style="display: flex; flex-direction: column; gap: 10px"><span class="lbl">Deine Antwort</span>
      <div role="radiogroup" aria-label="Deine Antwort" class="seg"><sc-for list="{{opts}}" as="o" hint-placeholder-count="3"><button role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" class="{{o.cls}}" style="{{o.style}}">{{o.label}}</button></sc-for></div>
    </div>
    <div class="grp">
      <a href="https://www.google.com/maps/search/Sportplatz+Dammweg+Berlin" class="row"><span class="ic"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"></path><circle cx="12" cy="9" r="2.5"></circle></svg></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Sportplatz Dammweg</span><span style="font-size: 13px" class="mut">Kunstrasen · Kabine 3 · Heimtrikot</span></span><span style="font-size: 14px; font-weight: 600; color: #0E3B2B">Route</span></a>
    </div>
    <section style="display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: center"><h2 class="lbl">Kader · 14 von 22 dabei</h2><button onClick="{{nudge}}" style="background: none; border: none; font-family: inherit; font-size: 14px; font-weight: 600; color: #0E3B2B; cursor: pointer; min-height: 44px">{{nudgeLabel}}</button></div>
      <div class="grp"><sc-for list="{{people}}" as="p" hint-placeholder-count="5"><a href="PlayerProfile.dc.html" class="{{p.cls}}" style="min-height: 54px"><span class="av">{{p.ini}}</span><span style="flex: 1; font-size: 15px; font-weight: 600">{{p.name}}</span><span style="{{p.sty}}">{{p.status}}</span></a></sc-for></div>
    </section>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 32px; background: #F6F5F1; box-shadow: 0 -1px 0 #E4E2DA; display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px">
    <a href="LiveMatch.dc.html" class="btn sec"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><circle cx="9" cy="14" r="5"></circle><path d="M13 10l8-4v4l-6 3"></path></svg>Live</a>
    <a href="Lineup.dc.html" class="btn pri">Aufstellung</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"club": {"editor": "color", "default": "#0E3B2B", "options": ["#0E3B2B", "#7A1F2B", "#123A5C", "#1F2A44"], "section": "Vereinsfarbe"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { a: "yes", nudged: false }; }
  renderVals() {
    const club = this.props.club ?? "#0E3B2B";
    const opts = [["yes","Dabei"],["maybe","Vielleicht"],["no","Absage"]].map(([id,label]) => { const on = this.state.a === id; return { label, on: on ? "true" : "false", pick: () => this.setState({ a: id }),
      style: on ? "background: " + club + "; color: #FFFFFF; box-shadow: none" : "" , cls: "sg" + (on ? " on" : "") }; });
    const people = [["LB","Lukas Becker","Dabei"],["KO","Kofi Osei","Dabei"],["MY","Mert Yılmaz","Absage · Arbeit"],["SK","Sinan Kaya","Vielleicht"],["JW","Jonas Wagner","Offen"]].map(([ini,name,status], i) => ({ ini, name, status, cls: "row" + (i === 4 ? " last" : ""),
      sty: "font-size: 13px; font-weight: 600; " + (status === "Dabei" ? "color: " + club : status === "Offen" ? "color: #5B675F" : "color: #121A15") }));
    return { club, opts, people, nudge: () => this.setState({ nudged: true }), nudgeLabel: this.state.nudged ? "Erinnert" : "5 erinnern" };
  }
}
</script>
</body>
</html>
