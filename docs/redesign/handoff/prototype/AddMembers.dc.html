<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Kader anlegen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;600;700&amp;display=swap">
<style>body{margin:0}a{color:#0E3B2B}a:hover{color:#121A15}
.scr{width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;background:#F6F5F1;color:#121A15;font-family:Inter,"IBM Plex Sans Arabic",system-ui,sans-serif}
.pad{padding:60px 20px 108px;display:flex;flex-direction:column;gap:24px}
.h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-0.025em;line-height:1.1}
.disp{font-family:"Barlow Condensed","IBM Plex Sans Arabic",sans-serif;font-weight:700;text-transform:uppercase;line-height:0.95}
.lbl{margin:0;font-size:12px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:#5B675F}
.mut{color:#5B675F}
.num{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.grp{background:#FFFFFF;border-radius:20px;padding:0 16px;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 0;box-sizing:border-box;border-bottom:1px solid #EDEBE4;text-decoration:none;color:#121A15;background:none;border-left:none;border-right:none;border-top:none;font-family:inherit;text-align:start;width:100%;cursor:pointer}
.row.last{border-bottom:none}
.ib{width:44px;height:44px;border-radius:22px;background:#FFFFFF;border:none;box-shadow:inset 0 0 0 1px #E4E2DA;display:flex;align-items:center;justify-content:center;color:#121A15;cursor:pointer;flex-shrink:0;text-decoration:none;position:relative}
.ib.dark{background:rgba(255,255,255,0.12);box-shadow:none;color:#FFFFFF}
.btn{height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;text-decoration:none;border:none;cursor:pointer;font-family:inherit;width:100%;box-sizing:border-box}
.pri{background:#121A15;color:#FFFFFF}.acc{background:#D4F25C;color:#121A15}.sec{background:transparent;color:#121A15;box-shadow:inset 0 0 0 1px #CFCDC4}
.sm{height:36px;padding:0 14px;border-radius:18px;font-size:13px;width:auto}
.chip{height:36px;padding:0 14px;border-radius:18px;font-size:13px;font-weight:600;border:none;box-shadow:inset 0 0 0 1px #D9D7CE;background:transparent;color:#121A15;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:#121A15;color:#FFFFFF;box-shadow:none}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#ECEAE3;border-radius:16px;padding:4px}
.sg{height:44px;border-radius:12px;border:none;background:transparent;color:#5B675F;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}
.sg.on{background:#FFFFFF;color:#121A15;box-shadow:0 1px 3px rgba(18,26,21,0.12)}
.av{width:36px;height:36px;border-radius:18px;background:#E8E6DE;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#121A15}
.ic{width:40px;height:40px;border-radius:12px;background:#F1EFE9;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#121A15}
.tag{font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap}
.fld{width:100%;height:52px;box-sizing:border-box;border-radius:14px;border:none;box-shadow:inset 0 0 0 1px #DEDCD3;background:#FFFFFF;padding:0 16px;font-family:inherit;font-size:16px;color:#121A15}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;box-sizing:border-box;padding:8px 8px 24px;background:#FFFFFF;box-shadow:0 -1px 0 #E4E2DA;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#5B675F;font-size:11px;font-weight:500}
.tab::after{content:"";width:4px;height:4px;border-radius:2px;background:transparent}
.tab.on{color:#121A15;font-weight:700}.tab.on::after{background:#121A15}
.stat{display:flex;flex-direction:column;gap:4px}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px}</style>
</helmet>
<div class="scr">
  <div class="pad" style="padding-bottom: 120px; gap: 20px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="Invite.dc.html" class="ib" aria-label="Zurück"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M15 5l-7 7 7 7"></path></svg></a>
      <span style="font-size: 13px; font-weight: 600" class="mut">Optional</span>
      <span style="width: 44px"></span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px"><h1 class="h1">Kader anlegen</h1><p style="margin: 0; font-size: 15px; line-height: 1.5" class="mut">Trag Trainer und Spieler selbst ein. Wer noch kein Konto hat, übernimmt sein Profil später mit dem Teamcode.</p></div>
    <div role="tablist" aria-label="Eingabe" class="seg" style="grid-template-columns: repeat(2, minmax(0, 1fr))"><sc-for list="{{modes}}" as="m" hint-placeholder-count="2"><button role="tab" aria-selected="{{m.on}}" onClick="{{m.pick}}" class="{{m.cls}}">{{m.label}}</button></sc-for></div>
    <sc-if value="{{isOne}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: grid; grid-template-columns: 1fr 76px; gap: 10px">
          <div style="display: flex; flex-direction: column; gap: 6px"><label for="nm" style="font-size: 13px; font-weight: 600">Name</label><input id="nm" class="fld" placeholder="Vor- und Nachname" value="{{name}}" onChange="{{onName}}"></div>
          <div style="display: flex; flex-direction: column; gap: 6px"><label for="nu" style="font-size: 13px; font-weight: 600">Nr.</label><input id="nu" class="fld" inputmode="numeric" placeholder="9" value="{{num}}" onChange="{{onNum}}" style="text-align: center"></div>
        </div>
        <div role="radiogroup" aria-label="Rolle" style="display: flex; gap: 8px; flex-wrap: wrap"><sc-for list="{{roles}}" as="r" hint-placeholder-count="4"><button role="radio" aria-checked="{{r.on}}" onClick="{{r.pick}}" class="{{r.cls}}">{{r.label}}</button></sc-for></div>
        <div style="display: flex; flex-direction: column; gap: 6px"><label for="ct" style="font-size: 13px; font-weight: 600">E-Mail oder Handy (optional)</label><input id="ct" class="fld" placeholder="Dann schicken wir eine Einladung" value="{{contact}}" onChange="{{onContact}}"></div>
        <button onClick="{{add}}" class="btn sec" style="height: 48px; font-size: 15px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 5v14M5 12h14"></path></svg>Hinzufügen</button>
      </div>
    </sc-if>
    <sc-if value="{{isPaste}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <label for="pl" style="font-size: 13px; font-weight: 600">Ein Spieler pro Zeile, Nummer davor optional</label>
        <textarea id="pl" class="fld" onChange="{{onPaste}}" style="height: 132px; padding: 14px 16px; line-height: 1.5; resize: none">{{paste}}</textarea>
        <button onClick="{{addAll}}" class="btn sec" style="height: 48px; font-size: 15px">{{pasteLabel}}</button>
      </div>
    </sc-if>
    <section style="display: flex; flex-direction: column; gap: 10px">
      <h2 class="lbl">{{count}}</h2>
      <div class="grp"><sc-for list="{{list}}" as="p" hint-placeholder-count="3"><div class="{{p.cls}}" style="cursor: default; min-height: 58px"><span class="av">{{p.i}}</span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">{{p.n}}</span><span style="font-size: 12px" class="mut">{{p.m}}</span></span><span style="{{p.tagS}}">{{p.s}}</span></div></sc-for></div>
    </section>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 32px; background: #F6F5F1; box-shadow: 0 -1px 0 #E4E2DA"><a href="Invite.dc.html" class="btn pri">Fertig</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { mode: "one", name: "", num: "", contact: "", role: "player", paste: "4 Tomasz Nowak\n10 Mert Yılmaz\n11 Sinan Kaya",
    list: [["YA","Yemi Ajimati","Vorstand · Trainer","Du","on"],["LB","Lukas Becker","Spieler · Kapitän · 6","Eingeladen","inv"],["KO","Kofi Osei","Spieler · 9","Ohne Konto","off"]] }; }
  renderVals() {
    const R = { player: "Spieler", captain: "Kapitän", coach: "Trainer", parent: "Elternteil" };
    const roles = Object.keys(R).map((id) => ({ label: R[id], on: this.state.role === id ? "true" : "false", cls: "chip" + (this.state.role === id ? " on" : ""), pick: () => this.setState({ role: id }) }));
    const ini = (n) => n.split(" ").filter(Boolean).map((w) => w[0]).slice(0,2).join("").toUpperCase();
    const add = () => { const n = this.state.name.trim(); if (!n) return;
      const meta = R[this.state.role] + (this.state.num ? " · " + this.state.num : "");
      const st = this.state.contact.trim() ? ["Eingeladen","inv"] : ["Ohne Konto","off"];
      this.setState({ list: this.state.list.concat([[ini(n), n, meta, st[0], st[1]]]), name: "", num: "", contact: "" }); };
    const lines = this.state.paste.split("\n").map((l) => l.trim()).filter(Boolean);
    const addAll = () => { const rows = lines.map((l) => { const m = l.match(/^(\d+)\s+(.*)$/); const n = m ? m[2] : l; return [ini(n), n, "Spieler" + (m ? " · " + m[1] : ""), "Ohne Konto", "off"]; });
      this.setState({ list: this.state.list.concat(rows), paste: "", mode: "one" }); };
    const tag = { on: "background: #EEF1E6; color: #2E3B13", inv: "background: #F1EFE9; color: #3E4A43", off: "background: transparent; color: #5B675F; box-shadow: inset 0 0 0 1px #CFCDC4" };
    const list = this.state.list.map(([i,n,m,s,k], idx, arr) => ({ i, n, m, s, cls: "row" + (idx === arr.length - 1 ? " last" : ""), tagS: "font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 8px; " + tag[k] }));
    const modes = [["one","Einzeln"],["paste","Liste einfügen"]].map(([id,label]) => ({ label, on: this.state.mode === id ? "true" : "false", cls: "sg" + (this.state.mode === id ? " on" : ""), pick: () => this.setState({ mode: id }) }));
    return { roles, modes, list, add, addAll, isOne: this.state.mode === "one", isPaste: this.state.mode === "paste",
      name: this.state.name, num: this.state.num, contact: this.state.contact, paste: this.state.paste,
      onName: (e) => this.setState({ name: e.target.value }), onNum: (e) => this.setState({ num: e.target.value }), onContact: (e) => this.setState({ contact: e.target.value }), onPaste: (e) => this.setState({ paste: e.target.value }),
      count: "Im Team · " + this.state.list.length, pasteLabel: lines.length + " Spieler anlegen" };
  }
}
</script>
</body>
</html>
