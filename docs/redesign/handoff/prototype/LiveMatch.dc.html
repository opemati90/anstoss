<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Live-Spiel</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;600;700&amp;display=swap">
<style>body{margin:0}a{color:#0E3B2B}a:hover{color:#121A15}
.scr{width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;background:#F6F5F1;color:#121A15;font-family:Inter,"IBM Plex Sans Arabic",system-ui,sans-serif}
.pad{padding:60px 20px 108px;display:flex;flex-direction:column;gap:24px}
.h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-0.025em;line-height:1.1}
.disp{font-family:"Barlow Condensed","IBM Plex Sans Arabic",sans-serif;font-weight:700;text-transform:uppercase;line-height:0.95}
.lbl{margin:0;font-size:12px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:#5B675F}
.mut{color:#5B675F}
.num{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.grp{background:#FFFFFF;border-radius:20px;padding:0 16px;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 0;box-sizing:border-box;border-bottom:1px solid #EDEBE4;text-decoration:none;color:#121A15;background:none;border-left:none;border-right:none;border-top:none;font-family:inherit;text-align:start;width:100%;cursor:pointer}
.row.last{border-bottom:none}
.ib{width:44px;height:44px;border-radius:22px;background:#FFFFFF;border:none;box-shadow:inset 0 0 0 1px #E4E2DA;display:flex;align-items:center;justify-content:center;color:#121A15;cursor:pointer;flex-shrink:0;text-decoration:none;position:relative}
.ib.dark{background:rgba(255,255,255,0.12);box-shadow:none;color:#FFFFFF}
.btn{height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;text-decoration:none;border:none;cursor:pointer;font-family:inherit;width:100%;box-sizing:border-box}
.pri{background:#121A15;color:#FFFFFF}.acc{background:#D4F25C;color:#121A15}.sec{background:transparent;color:#121A15;box-shadow:inset 0 0 0 1px #CFCDC4}
.sm{height:36px;padding:0 14px;border-radius:18px;font-size:13px;width:auto}
.chip{height:36px;padding:0 14px;border-radius:18px;font-size:13px;font-weight:600;border:none;box-shadow:inset 0 0 0 1px #D9D7CE;background:transparent;color:#121A15;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:#121A15;color:#FFFFFF;box-shadow:none}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#ECEAE3;border-radius:16px;padding:4px}
.sg{height:44px;border-radius:12px;border:none;background:transparent;color:#5B675F;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}
.sg.on{background:#FFFFFF;color:#121A15;box-shadow:0 1px 3px rgba(18,26,21,0.12)}
.av{width:36px;height:36px;border-radius:18px;background:#E8E6DE;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#121A15}
.ic{width:40px;height:40px;border-radius:12px;background:#F1EFE9;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#121A15}
.tag{font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap}
.fld{width:100%;height:52px;box-sizing:border-box;border-radius:14px;border:none;box-shadow:inset 0 0 0 1px #DEDCD3;background:#FFFFFF;padding:0 16px;font-family:inherit;font-size:16px;color:#121A15}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;box-sizing:border-box;padding:8px 8px 24px;background:#FFFFFF;box-shadow:0 -1px 0 #E4E2DA;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#5B675F;font-size:11px;font-weight:500}
.tab::after{content:"";width:4px;height:4px;border-radius:2px;background:transparent}
.tab.on{color:#121A15;font-weight:700}.tab.on::after{background:#121A15}
.stat{display:flex;flex-direction:column;gap:4px}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px}</style>
</helmet>
<div class="scr">
  <div style="background: {{club}}; color: #FFFFFF; padding: 60px 20px 28px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; align-items: center; justify-content: space-between"><a href="Event.dc.html" class="ib dark" aria-label="Zurück"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M15 5l-7 7 7 7"></path></svg></a><span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700"><span style="width: 8px; height: 8px; border-radius: 4px; background: #D4F25C"></span>LIVE · 63'</span><span style="width: 44px"></span></div>
    <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><svg role="img" aria-label="Wappen SV Spreewiese" width="44" height="48" viewBox="0 0 40 44"><path d="M20 1.5 37.5 7.5v12.5c0 10.5-7.5 18.5-17.5 22.5C10 38.5 2.5 30.5 2.5 20V7.5z" fill="#FFFFFF"></path><path d="M20 5 34 9.8v10.2c0 8.6-6 15.2-14 18.6C12 35.2 6 28.6 6 20V9.8z" fill="none" stroke="#D4F25C" stroke-opacity="0.55" stroke-width="1"></path><text x="20" y="25.5" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="700" font-size="12.5" fill="#121A15">SVS</text></svg><span style="font-size: 13px; font-weight: 600; text-align: center">SV Spreewiese</span></div>
      <span class="num" style="font-size: 72px; line-height: 1">{{us}}:{{them}}</span>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px"><svg role="img" aria-label="Wappen Rot-Weiß Köpenick" width="44" height="48" viewBox="0 0 40 44"><path d="M20 1.5 37.5 7.5v12.5c0 10.5-7.5 18.5-17.5 22.5C10 38.5 2.5 30.5 2.5 20V7.5z" fill="#B23A3A"></path><path d="M20 5 34 9.8v10.2c0 8.6-6 15.2-14 18.6C12 35.2 6 28.6 6 20V9.8z" fill="none" stroke="#D4F25C" stroke-opacity="0.55" stroke-width="1"></path><text x="20" y="25.5" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="700" font-size="12.5" fill="#FFFFFF">RWK</text></svg><span style="font-size: 13px; font-weight: 600; text-align: center">RW Köpenick III</span></div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 20px; padding: 20px 20px 120px">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button onClick="{{goalUs}}" class="btn acc" style="height: 64px; border-radius: 20px; flex-direction: column; gap: 0"><span style="font-size: 16px">Tor</span><span style="font-size: 12px; font-weight: 500">für uns</span></button>
      <button onClick="{{goalThem}}" class="btn sec" style="height: 64px; border-radius: 20px; flex-direction: column; gap: 0"><span style="font-size: 16px">Gegentor</span><span style="font-size: 12px; font-weight: 500" class="mut">für Gegner</span></button>
      <button class="btn sec" style="height: 52px; border-radius: 16px; font-size: 15px">Karte</button>
      <button class="btn sec" style="height: 52px; border-radius: 16px; font-size: 15px"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M7 7h12l-3-3M17 17H5l3 3"></path></svg>Wechsel</button>
    </div>
    <section style="display: flex; flex-direction: column; gap: 12px"><h2 class="lbl">Spielverlauf</h2>
      <div class="grp"><sc-for list="{{log}}" as="e" hint-placeholder-count="2"><div class="{{e.cls}}" style="min-height: 52px"><span class="num" style="width: 36px; font-size: 18px">{{e.m}}</span><span style="flex: 1; font-size: 15px; font-weight: 600">{{e.w}}</span><span style="font-size: 13px" class="mut">{{e.k}}</span></div></sc-for></div>
    </section>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 20px 32px; background: #F6F5F1; box-shadow: 0 -1px 0 #E4E2DA; display: grid; grid-template-columns: 1fr 1fr; gap: 10px"><a href="StudioEditor.dc.html" class="btn sec"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Posten</a><a href="Event.dc.html" class="btn pri">Abpfiff</a></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"club": {"editor": "color", "default": "#0E3B2B", "options": ["#0E3B2B", "#7A1F2B", "#123A5C", "#1F2A44"], "section": "Vereinsfarbe"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { us: 1, them: 0, log: [["23'","Tor","Kofi Osei"],["41'","Gelb","Tomasz Nowak"]] }; }
  renderVals() {
    const add = (who) => () => { const s = Object.assign({}, this.state); if (who === "us") { s.us = s.us + 1; s.log = [["63'","Tor","Sinan Kaya"]].concat(s.log); } else { s.them = s.them + 1; s.log = [["63'","Gegentor","Rot-Weiß Köpenick"]].concat(s.log); } this.setState(s); };
    const log = this.state.log.map(([m,k,w], i) => ({ m, k, w, cls: "row" + (i === this.state.log.length - 1 ? " last" : "") }));
    return { club: this.props.club ?? "#0E3B2B", us: this.state.us, them: this.state.them, goalUs: add("us"), goalThem: add("them"), log };
  }
}
</script>
</body>
</html>
