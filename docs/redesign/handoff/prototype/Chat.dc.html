<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Team-Chat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;600;700&amp;display=swap">
<style>body{margin:0}a{color:#0E3B2B}a:hover{color:#121A15}
.scr{width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;background:#F6F5F1;color:#121A15;font-family:Inter,"IBM Plex Sans Arabic",system-ui,sans-serif}
.pad{padding:60px 20px 108px;display:flex;flex-direction:column;gap:24px}
.h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-0.025em;line-height:1.1}
.disp{font-family:"Barlow Condensed","IBM Plex Sans Arabic",sans-serif;font-weight:700;text-transform:uppercase;line-height:0.95}
.lbl{margin:0;font-size:12px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:#5B675F}
.mut{color:#5B675F}
.num{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.grp{background:#FFFFFF;border-radius:20px;padding:0 16px;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 0;box-sizing:border-box;border-bottom:1px solid #EDEBE4;text-decoration:none;color:#121A15;background:none;border-left:none;border-right:none;border-top:none;font-family:inherit;text-align:start;width:100%;cursor:pointer}
.row.last{border-bottom:none}
.ib{width:44px;height:44px;border-radius:22px;background:#FFFFFF;border:none;box-shadow:inset 0 0 0 1px #E4E2DA;display:flex;align-items:center;justify-content:center;color:#121A15;cursor:pointer;flex-shrink:0;text-decoration:none;position:relative}
.ib.dark{background:rgba(255,255,255,0.12);box-shadow:none;color:#FFFFFF}
.btn{height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;text-decoration:none;border:none;cursor:pointer;font-family:inherit;width:100%;box-sizing:border-box}
.pri{background:#121A15;color:#FFFFFF}.acc{background:#D4F25C;color:#121A15}.sec{background:transparent;color:#121A15;box-shadow:inset 0 0 0 1px #CFCDC4}
.sm{height:36px;padding:0 14px;border-radius:18px;font-size:13px;width:auto}
.chip{height:36px;padding:0 14px;border-radius:18px;font-size:13px;font-weight:600;border:none;box-shadow:inset 0 0 0 1px #D9D7CE;background:transparent;color:#121A15;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:#121A15;color:#FFFFFF;box-shadow:none}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#ECEAE3;border-radius:16px;padding:4px}
.sg{height:44px;border-radius:12px;border:none;background:transparent;color:#5B675F;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}
.sg.on{background:#FFFFFF;color:#121A15;box-shadow:0 1px 3px rgba(18,26,21,0.12)}
.av{width:36px;height:36px;border-radius:18px;background:#E8E6DE;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#121A15}
.ic{width:40px;height:40px;border-radius:12px;background:#F1EFE9;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#121A15}
.tag{font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap}
.fld{width:100%;height:52px;box-sizing:border-box;border-radius:14px;border:none;box-shadow:inset 0 0 0 1px #DEDCD3;background:#FFFFFF;padding:0 16px;font-family:inherit;font-size:16px;color:#121A15}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;box-sizing:border-box;padding:8px 8px 24px;background:#FFFFFF;box-shadow:0 -1px 0 #E4E2DA;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#5B675F;font-size:11px;font-weight:500}
.tab::after{content:"";width:4px;height:4px;border-radius:2px;background:transparent}
.tab.on{color:#121A15;font-weight:700}.tab.on::after{background:#121A15}
.stat{display:flex;flex-direction:column;gap:4px}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px}</style>
</helmet>
<div class="scr">
  <div style="padding: 60px 20px 14px; display: flex; flex-direction: column; gap: 16px; box-shadow: 0 1px 0 #E4E2DA">
    <header style="display: flex; align-items: center; justify-content: space-between"><h1 class="h1">Chat</h1><button class="ib" aria-label="Neue Nachricht"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></button></header>
    <div role="tablist" aria-label="Kanäle" style="display: flex; gap: 8px"><sc-for list="{{chans}}" as="c" hint-placeholder-count="4"><button role="tab" aria-selected="{{c.on}}" onClick="{{c.pick}}" class="{{c.cls}}">{{c.label}}<sc-if value="{{c.hasCount}}" hint-placeholder-val="{{ false }}"><span style="min-width: 18px; height: 18px; border-radius: 9px; background: #D4F25C; color: #121A15; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; box-sizing: border-box">{{c.count}}</span></sc-if></button></sc-for></div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 14px; padding: 16px 20px 170px">
    <div style="display: flex; gap: 12px; align-items: flex-start; background: #FFFFFF; border-radius: 20px; padding: 14px">
      <span class="ic"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 11v2a1 1 0 0 0 1 1h3l5 4V6L7 10H4a1 1 0 0 0-1 1z"></path><path d="M16 9a4 4 0 0 1 0 6"></path></svg></span>
      <div style="display: flex; flex-direction: column; gap: 4px"><span style="font-size: 12px; font-weight: 600" class="mut">Angeheftet · Trainer</span><span style="font-size: 14px; line-height: 1.45">Sonntag 13:00 in Kabine 3. Beide Trikots mitbringen.</span></div>
    </div>
    <div style="display: flex; gap: 8px; align-items: flex-end">
      <span class="av" style="width: 30px; height: 30px; font-size: 11px">KO</span>
      <div style="display: flex; flex-direction: column; gap: 4px; max-width: 250px"><span style="font-size: 12px; font-weight: 600" class="mut">Kofi Osei</span><span style="background: #FFFFFF; border-radius: 18px 18px 18px 6px; padding: 10px 14px; font-size: 15px; line-height: 1.4">Wer nimmt die Bälle mit? Ich bin erst 13:15 da.</span></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; background: #FFFFFF; border-radius: 20px; padding: 16px">
      <div style="display: flex; justify-content: space-between"><span class="lbl">Umfrage</span><span style="font-size: 12px" class="mut">12 Stimmen</span></div>
      <span style="font-weight: 700; font-size: 16px">Mannschaftsabend nach dem Spiel?</span>
      <button style="position: relative; height: 46px; border-radius: 14px; border: none; box-shadow: inset 0 0 0 2px #121A15; background: #FFFFFF; overflow: hidden; font-family: inherit; cursor: pointer; padding: 0"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 75%; background: #EEF1E6"></span><span style="position: relative; display: flex; justify-content: space-between; padding: 0 14px; font-size: 14px; font-weight: 700; color: #121A15"><span>Ja, Vereinsheim</span><span class="num" style="font-size: 17px">9</span></span></button>
      <button style="position: relative; height: 46px; border-radius: 14px; border: none; box-shadow: inset 0 0 0 1px #E4E2DA; background: #FFFFFF; overflow: hidden; font-family: inherit; cursor: pointer; padding: 0"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 25%; background: #F3F2EE"></span><span style="position: relative; display: flex; justify-content: space-between; padding: 0 14px; font-size: 14px; font-weight: 600; color: #121A15"><span>Nächste Woche</span><span class="num" style="font-size: 17px">3</span></span></button>
    </div>
    <div style="display: flex; justify-content: flex-end">
      <div style="display: flex; flex-direction: column; gap: 4px; align-items: flex-end; max-width: 270px">
        <a href="Lineup.dc.html" style="display: flex; align-items: center; gap: 12px; background: {{club}}; color: #FFFFFF; border-radius: 18px 18px 6px 18px; padding: 12px 14px; text-decoration: none"><span style="display: flex; color: #FFFFFF"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M4 12h16"></path><circle cx="12" cy="12" r="3"></circle></svg></span><span style="display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 700">Aufstellung Sonntag</span><span style="font-size: 12px; color: #C9D6CF">4-2-3-1 · antippen zum Ansehen</span></span></a>
        <span style="font-size: 11px" class="mut">Gelesen von 14</span>
      </div>
    </div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 84px; padding: 10px 16px; background: #F6F5F1; box-shadow: 0 -1px 0 #E4E2DA; display: flex; gap: 8px; align-items: center">
    <button class="ib" aria-label="Anhang"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 5v14M5 12h14"></path></svg></button>
    <label for="msg" class="sr">Nachricht</label>
    <input id="msg" class="fld" placeholder="Nachricht an 1. Herren" style="height: 44px; border-radius: 22px; font-size: 15px">
    <button class="ib" aria-label="Senden" style="background: #121A15; color: #FFFFFF; box-shadow: none"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" ><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
  </div>
  <nav aria-label="Hauptnavigation" class="tabs" style="grid-template-columns: repeat(5, minmax(0, 1fr))"><a href="Home.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg>Start</a><a href="Calendar.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Termine</a><a href="Chat.dc.html" class="tab on" aria-current="page"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" ><path d="M4 5h16v11H8l-4 4z"></path></svg>Chat</a><a href="Squad.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"></path><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.5 3.5 5.2"></path></svg>Kader</a><a href="More.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ><circle cx="5" cy="12" r="1.2"></circle><circle cx="12" cy="12" r="1.2"></circle><circle cx="19" cy="12" r="1.2"></circle></svg>Mehr</a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"club": {"editor": "color", "default": "#0E3B2B", "options": ["#0E3B2B", "#7A1F2B", "#123A5C", "#1F2A44"], "section": "Vereinsfarbe"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { c: "team" }; }
  renderVals() {
    const chans = [["team","Team",3],["coaches","Trainer",0],["news","Infos",1],["dm","Direkt",2]].map(([id,label,n]) => { const on = this.state.c === id; return { label, count: n ? String(n) : "", hasCount: !!n, on: on ? "true" : "false", cls: "chip" + (on ? " on" : ""), pick: () => this.setState({ c: id }) }; });
    return { club: this.props.club ?? "#0E3B2B", chans };
  }
}
</script>
</body>
</html>
