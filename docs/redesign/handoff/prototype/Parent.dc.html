<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Start – Eltern</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;600;700&amp;display=swap">
<style>body{margin:0}a{color:#0E3B2B}a:hover{color:#121A15}
.scr{width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;background:#F6F5F1;color:#121A15;font-family:Inter,"IBM Plex Sans Arabic",system-ui,sans-serif}
.pad{padding:60px 20px 108px;display:flex;flex-direction:column;gap:24px}
.h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-0.025em;line-height:1.1}
.disp{font-family:"Barlow Condensed","IBM Plex Sans Arabic",sans-serif;font-weight:700;text-transform:uppercase;line-height:0.95}
.lbl{margin:0;font-size:12px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:#5B675F}
.mut{color:#5B675F}
.num{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.grp{background:#FFFFFF;border-radius:20px;padding:0 16px;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 0;box-sizing:border-box;border-bottom:1px solid #EDEBE4;text-decoration:none;color:#121A15;background:none;border-left:none;border-right:none;border-top:none;font-family:inherit;text-align:start;width:100%;cursor:pointer}
.row.last{border-bottom:none}
.ib{width:44px;height:44px;border-radius:22px;background:#FFFFFF;border:none;box-shadow:inset 0 0 0 1px #E4E2DA;display:flex;align-items:center;justify-content:center;color:#121A15;cursor:pointer;flex-shrink:0;text-decoration:none;position:relative}
.ib.dark{background:rgba(255,255,255,0.12);box-shadow:none;color:#FFFFFF}
.btn{height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;text-decoration:none;border:none;cursor:pointer;font-family:inherit;width:100%;box-sizing:border-box}
.pri{background:#121A15;color:#FFFFFF}.acc{background:#D4F25C;color:#121A15}.sec{background:transparent;color:#121A15;box-shadow:inset 0 0 0 1px #CFCDC4}
.sm{height:36px;padding:0 14px;border-radius:18px;font-size:13px;width:auto}
.chip{height:36px;padding:0 14px;border-radius:18px;font-size:13px;font-weight:600;border:none;box-shadow:inset 0 0 0 1px #D9D7CE;background:transparent;color:#121A15;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:#121A15;color:#FFFFFF;box-shadow:none}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#ECEAE3;border-radius:16px;padding:4px}
.sg{height:44px;border-radius:12px;border:none;background:transparent;color:#5B675F;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}
.sg.on{background:#FFFFFF;color:#121A15;box-shadow:0 1px 3px rgba(18,26,21,0.12)}
.av{width:36px;height:36px;border-radius:18px;background:#E8E6DE;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#121A15}
.ic{width:40px;height:40px;border-radius:12px;background:#F1EFE9;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#121A15}
.tag{font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap}
.fld{width:100%;height:52px;box-sizing:border-box;border-radius:14px;border:none;box-shadow:inset 0 0 0 1px #DEDCD3;background:#FFFFFF;padding:0 16px;font-family:inherit;font-size:16px;color:#121A15}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;box-sizing:border-box;padding:8px 8px 24px;background:#FFFFFF;box-shadow:0 -1px 0 #E4E2DA;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#5B675F;font-size:11px;font-weight:500}
.tab::after{content:"";width:4px;height:4px;border-radius:2px;background:transparent}
.tab.on{color:#121A15;font-weight:700}.tab.on::after{background:#121A15}
.stat{display:flex;flex-direction:column;gap:4px}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px}</style>
</helmet>
<div class="scr">
  <div class="pad" style="gap: 20px">
    <header style="display: flex; align-items: center; gap: 12px"><svg role="img" aria-label="Wappen SV Spreewiese" width="36" height="40" viewBox="0 0 40 44"><path d="M20 1.5 37.5 7.5v12.5c0 10.5-7.5 18.5-17.5 22.5C10 38.5 2.5 30.5 2.5 20V7.5z" fill="{{club}}"></path><path d="M20 5 34 9.8v10.2c0 8.6-6 15.2-14 18.6C12 35.2 6 28.6 6 20V9.8z" fill="none" stroke="#D4F25C" stroke-opacity="0.55" stroke-width="1"></path><text x="20" y="25.5" text-anchor="middle" font-family="Barlow Condensed, sans-serif" font-weight="700" font-size="12.5" fill="#FFFFFF">SVS</text></svg><span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 12px" class="mut">SV Spreewiese · Eltern</span><span style="font-weight: 700; font-size: 16px">Hallo Familie Weber</span></span><a href="Notifications.dc.html" class="ib" aria-label="Mitteilungen"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7.5 2.5 7.5h-17S6 15 6 9z"></path><path d="M10 20a2 2 0 0 0 4 0"></path></svg></a></header>
    <div role="tablist" aria-label="Kind" style="display: flex; gap: 8px"><sc-for list="{{chips}}" as="c" hint-placeholder-count="2"><button role="tab" aria-selected="{{c.on}}" onClick="{{c.pick}}" class="{{c.cls}}">{{c.label}}</button></sc-for></div>
    <div style="display: flex; flex-direction: column; gap: 18px; padding: 22px; border-radius: 28px; background: {{club}}; color: #FFFFFF">
      <div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600; color: #C9D6CF">{{k.team}} · {{k.vs}}</span><span class="disp" style="font-size: 50px">{{k.ev}}</span><span style="font-size: 13px; color: #C9D6CF">{{k.meet}}</span></div>
      <div style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 13px; font-weight: 600">{{forWho}}</span>
        <div role="radiogroup" aria-label="{{forWho}}" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; background: rgba(255,255,255,0.12); border-radius: 16px; padding: 4px"><sc-for list="{{opts}}" as="o" hint-placeholder-count="3"><button role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></div>
      </div>
    </div>
    <div class="grp">
      <sc-if value="{{away}}" hint-placeholder-val="{{ true }}"><div class="row"><span class="ic"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 13l2-6h14l2 6v5H3z"></path><circle cx="7.5" cy="18" r="1.5"></circle><circle cx="16.5" cy="18" r="1.5"></circle></svg></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Fahrgemeinschaft</span><span style="font-size: 13px" class="mut">{{seatNote}}</span></span><button onClick="{{seat}}" class="btn acc sm">{{seatLabel}}</button></div></sc-if>
      <div class="row"><span class="ic"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 3l8 3v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"></path></svg></span><span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 600">Fotoeinwilligung</span><span style="font-size: 13px" class="mut">Für Mannschaftsfotos auf der Vereinsseite</span></span><button class="btn sec sm">Prüfen</button></div>
      <a href="MyDues.dc.html" class="row last"><span class="ic"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18M7 15h3"></path></svg></span><span style="flex: 1; font-size: 15px; font-weight: 600">Beitrag Jugend</span><span class="tag" style="background: #F1EFE9; color: #3E4A43">Fällig 30.11.</span><span class="mut" style="display: flex"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M9 6l6 6-6 6"></path></svg></span></a>
    </div>
  </div>
  <nav aria-label="Hauptnavigation" class="tabs" style="grid-template-columns: repeat(4, minmax(0, 1fr))"><a href="Parent.dc.html" class="tab on" aria-current="page"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" ><path d="M3 10.5 12 3l9 7.5V21h-6v-6H9v6H3z"></path></svg>Start</a><a href="PlayerCalendar.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Termine</a><a href="Chat.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ><path d="M4 5h16v11H8l-4 4z"></path></svg>Chat</a><a href="More.dc.html" class="tab"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ><circle cx="5" cy="12" r="1.2"></circle><circle cx="12" cy="12" r="1.2"></circle><circle cx="19" cy="12" r="1.2"></circle></svg>Mehr</a></nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"club": {"editor": "color", "default": "#0E3B2B", "options": ["#0E3B2B", "#7A1F2B", "#123A5C", "#1F2A44"], "section": "Vereinsfarbe"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { k: "emil", a: {}, seat: false }; }
  renderVals() {
    const kids = { emil: { n: "Emil", team: "E-Jugend", ev: "Sa 10:00", vs: "Turnier in Treptow", meet: "Treffpunkt 9:15 · Halle Am Treptower Park", away: true },
                   lina: { n: "Lina", team: "D-Juniorinnen", ev: "Di 17:00", vs: "Training", meet: "Platz 2, Dammweg", away: false } };
    const k = kids[this.state.k];
    const chips = [["emil","Emil · E-Jugend"],["lina","Lina · D-Juniorinnen"]].map(([id,label]) => ({ label, on: this.state.k === id ? "true" : "false", cls: "chip" + (this.state.k === id ? " on" : ""), pick: () => this.setState({ k: id }) }));
    const cur = this.state.a[this.state.k];
    const opts = [["yes","Dabei"],["maybe","Vielleicht"],["no","Absage"]].map(([id,label]) => { const on = cur === id; return { label, on: on ? "true" : "false",
      pick: () => { const a = Object.assign({}, this.state.a); a[this.state.k] = id; this.setState({ a }); },
      style: "height: 48px; border-radius: 13px; border: none; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; " + (on ? "background: #FFFFFF; color: #121A15" : "background: transparent; color: #FFFFFF") }; });
    return { club: this.props.club ?? "#0E3B2B", chips, k, opts, forWho: "Antwort für " + k.n, away: k.away,
      seat: () => this.setState({ seat: true }), seatLabel: this.state.seat ? "Angeboten" : "Platz anbieten", seatNote: this.state.seat ? "Du fährst. 2 Plätze frei." : "2 Kinder suchen noch eine Mitfahrt" };
  }
}
</script>
</body>
</html>
