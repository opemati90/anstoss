<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Aufstellung</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Sans+Arabic:wght@400;600;700&amp;display=swap">
<style>body{margin:0}a{color:#0E3B2B}a:hover{color:#121A15}
.scr{width:390px;height:844px;position:relative;overflow:hidden;box-sizing:border-box;background:#F6F5F1;color:#121A15;font-family:Inter,"IBM Plex Sans Arabic",system-ui,sans-serif}
.pad{padding:60px 20px 108px;display:flex;flex-direction:column;gap:24px}
.h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-0.025em;line-height:1.1}
.disp{font-family:"Barlow Condensed","IBM Plex Sans Arabic",sans-serif;font-weight:700;text-transform:uppercase;line-height:0.95}
.lbl{margin:0;font-size:12px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;color:#5B675F}
.mut{color:#5B675F}
.num{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-variant-numeric:tabular-nums}
.grp{background:#FFFFFF;border-radius:20px;padding:0 16px;display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;min-height:60px;padding:12px 0;box-sizing:border-box;border-bottom:1px solid #EDEBE4;text-decoration:none;color:#121A15;background:none;border-left:none;border-right:none;border-top:none;font-family:inherit;text-align:start;width:100%;cursor:pointer}
.row.last{border-bottom:none}
.ib{width:44px;height:44px;border-radius:22px;background:#FFFFFF;border:none;box-shadow:inset 0 0 0 1px #E4E2DA;display:flex;align-items:center;justify-content:center;color:#121A15;cursor:pointer;flex-shrink:0;text-decoration:none;position:relative}
.ib.dark{background:rgba(255,255,255,0.12);box-shadow:none;color:#FFFFFF}
.btn{height:56px;border-radius:28px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;text-decoration:none;border:none;cursor:pointer;font-family:inherit;width:100%;box-sizing:border-box}
.pri{background:#121A15;color:#FFFFFF}.acc{background:#D4F25C;color:#121A15}.sec{background:transparent;color:#121A15;box-shadow:inset 0 0 0 1px #CFCDC4}
.sm{height:36px;padding:0 14px;border-radius:18px;font-size:13px;width:auto}
.chip{height:36px;padding:0 14px;border-radius:18px;font-size:13px;font-weight:600;border:none;box-shadow:inset 0 0 0 1px #D9D7CE;background:transparent;color:#121A15;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.on{background:#121A15;color:#FFFFFF;box-shadow:none}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:#ECEAE3;border-radius:16px;padding:4px}
.sg{height:44px;border-radius:12px;border:none;background:transparent;color:#5B675F;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}
.sg.on{background:#FFFFFF;color:#121A15;box-shadow:0 1px 3px rgba(18,26,21,0.12)}
.av{width:36px;height:36px;border-radius:18px;background:#E8E6DE;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#121A15}
.ic{width:40px;height:40px;border-radius:12px;background:#F1EFE9;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#121A15}
.tag{font-size:11px;font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap}
.fld{width:100%;height:52px;box-sizing:border-box;border-radius:14px;border:none;box-shadow:inset 0 0 0 1px #DEDCD3;background:#FFFFFF;padding:0 16px;font-family:inherit;font-size:16px;color:#121A15}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tabs{position:absolute;left:0;right:0;bottom:0;height:84px;box-sizing:border-box;padding:8px 8px 24px;background:#FFFFFF;box-shadow:0 -1px 0 #E4E2DA;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;color:#5B675F;font-size:11px;font-weight:500}
.tab::after{content:"";width:4px;height:4px;border-radius:2px;background:transparent}
.tab.on{color:#121A15;font-weight:700}.tab.on::after{background:#121A15}
.stat{display:flex;flex-direction:column;gap:4px}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px}</style>
</helmet>
<div class="scr" style="background: #101712; color: #FFFFFF; display: flex; flex-direction: column; gap: 16px; padding: 60px 20px 32px">
  <header style="display: flex; align-items: center; gap: 12px">
    <a href="Event.dc.html" class="ib dark" aria-label="Zurück"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex: 1; display: flex; flex-direction: column"><span class="disp" style="font-size: 24px">Aufstellung</span><span style="font-size: 12px; color: #A9B8B0">So 15.11. · vs. RW Köpenick III</span></div>
    <a href="StudioEditor.dc.html" class="ib dark" aria-label="Als Grafik posten"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></a>
    <a href="Chat.dc.html" class="btn acc sm" style="height: 44px; border-radius: 22px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 15V3M7 8l5-5 5 5M5 13v7h14v-7"></path></svg>Ans Team</a>
  </header>
  <div role="tablist" aria-label="Formation" style="display: flex; gap: 6px"><sc-for list="{{forms}}" as="f" hint-placeholder-count="4"><button role="tab" aria-selected="{{f.on}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button></sc-for></div>
  <div style="position: relative; flex: 1; border-radius: 24px; background: {{club}}; overflow: hidden">
    <svg aria-hidden="true" width="100%" height="100%" viewBox="0 0 350 480" preserveAspectRatio="none" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" style="position: absolute; inset: 0"><rect x="12" y="12" width="326" height="456" rx="6"></rect><path d="M12 240h326"></path><circle cx="175" cy="240" r="44"></circle><rect x="95" y="12" width="160" height="64"></rect><rect x="140" y="12" width="70" height="22"></rect><rect x="95" y="404" width="160" height="64"></rect><rect x="140" y="446" width="70" height="22"></rect></svg>
    <sc-for list="{{slots}}" as="s" hint-placeholder-count="11"><div style="{{s.pos}}"><span style="{{s.chip}}">{{s.num}}</span><span style="font-size: 11px; font-weight: 600; color: #FFFFFF; white-space: nowrap">{{s.name}}</span></div></sc-for>
  </div>
  <div style="display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #A9B8B0"><span style="font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase">Bank · 5</span><span>Halten und aufs Feld ziehen</span></div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px"><sc-for list="{{bench}}" as="b" hint-placeholder-count="5"><button style="height: 58px; border-radius: 16px; background: rgba(255,255,255,0.06); border: none; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: inherit; cursor: grab"><span class="num" style="font-size: 19px; line-height: 1">{{b.num}}</span><span style="font-size: 11px; color: #C9D6CF">{{b.name}}</span></button></sc-for></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"club": {"editor": "color", "default": "#0E3B2B", "options": ["#0E3B2B", "#7A1F2B", "#123A5C", "#1F2A44"], "section": "Vereinsfarbe"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { f: "4-2-3-1" }; }
  renderVals() {
    const club = this.props.club ?? "#0E3B2B";
    const forms = ["4-2-3-1","4-4-2","4-3-3","3-5-2"].map((label) => { const on = this.state.f === label; return { label, on: on ? "true" : "false", pick: () => this.setState({ f: label }),
      style: "flex: 1; height: 38px; border-radius: 19px; border: none; font-family: 'Barlow Condensed', sans-serif; font-size: 17px; font-weight: 700; cursor: pointer; " + (on ? "background: #FFFFFF; color: #121A15" : "background: transparent; color: #C9D6CF; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18)") }; });
    const L = { "4-2-3-1": [[50,10],[18,31],[50,29],[82,31],[34,52],[66,52],[12,72],[37,75],[63,75],[88,72],[50,91]],
      "4-4-2": [[36,11],[64,11],[12,36],[37,40],[63,40],[88,36],[12,70],[37,74],[63,74],[88,70],[50,91]],
      "4-3-3": [[18,13],[50,10],[82,13],[30,40],[50,46],[70,40],[12,70],[37,74],[63,74],[88,70],[50,91]],
      "3-5-2": [[36,11],[64,11],[10,38],[30,44],[50,38],[70,44],[90,38],[25,72],[50,75],[75,72],[50,91]] };
    const roster = [["9","Osei"],["11","Kaya"],["10","Yılmaz"],[null,"Offen"],["6","Becker"],["8","Schulz"],["3","Hoffmann"],["4","Nowak"],["5","Petrović"],[null,"Offen"],["1","Wagner"]];
    const slots = L[this.state.f].map(([x,y], i) => { const [num,name] = roster[i]; const e = !num; return { num: e ? "+" : num, name,
      pos: "position: absolute; left: " + x + "%; top: " + y + "%; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 4px",
      chip: "width: 42px; height: 42px; border-radius: 21px; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 19px; box-sizing: border-box; " + (e ? "border: 1.5px dashed rgba(255,255,255,0.7); color: #FFFFFF" : "background: #FFFFFF; color: #121A15; box-shadow: 0 4px 10px rgba(0,0,0,0.25)") }; });
    const bench = [["7","Meyer"],["14","Adeyemi"],["17","Lange"],["2","Krüger"],["21","Brandt"]].map(([num,name]) => ({ num, name }));
    return { club, forms, slots, bench };
  }
}
</script>
</body>
</html>
